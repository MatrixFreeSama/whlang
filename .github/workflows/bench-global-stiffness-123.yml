name: Quick Wheelchair 1.2.3 Global Stiffness vs Expert C

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bench-global-stiffness-123.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1, 2, 3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - name: Build Wheelchair 1.2.3
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
      - name: Probe AVX-512
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualified=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile matched contestants
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for q in 1 2 4; do
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/global_stiffness_wh_q${q}" --executors "$q" >/dev/null
          done
          gcc -O3 -march=native -mtune=native -flto -ffast-math -pthread \
            ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c \
            -o build/global_stiffness_c
          gcc --version | head -1
      - name: Benchmark 10M and 100M
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/global_stiffness_123/bench.py | tee /tmp/global-stiffness-result.txt
          {
            echo "RUNNER_IMAGE=${{ matrix.image }}"
            echo "RUNNER_SLOT=${{ matrix.slot }}"
            lscpu
            cat /tmp/probe.txt
            cat /tmp/global-stiffness-result.txt
          } > /tmp/global-stiffness-full.txt
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: global-stiffness-${{ matrix.image }}-${{ matrix.slot }}
          path: /tmp/global-stiffness-full.txt
          if-no-files-found: error
          retention-days: 30
