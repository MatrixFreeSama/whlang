name: paper-support-v4-1.3.127
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paper-support-v4.yml']
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check AVX-512 eligibility
        id: isa
        shell: bash
        run: |
          lscpu
          if grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            echo 'AVX-512 host accepted for the predeclared v4 table.'
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'AVX-512 absent; structural v4 table skipped on this host.'
          fi
      - name: Run structural v4 experiment
        if: steps.isa.outputs.eligible == 'true'
        run: python3 experiments/paper_1_3_127/run_support_v4.py
      - name: Commit raw structural record
        if: steps.isa.outputs.eligible == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/paper_1_3_127/support_v4_20261005
          git rm .github/workflows/paper-support-v4.yml
          git commit -m 'Record Wheelchair 1.3.127 structural v4 paper results'
          git push origin HEAD:main
# retry 2: capability gate is unchanged and precedes all timing
