name: restore-release-1.3.126

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-1.3.126-restore.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Wheelchair 1.3.126 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/Wheelchair-1.3.126.zip"
          checksum_file="dist/Wheelchair-1.3.126.zip.sha256"
          (cd dist && sha256sum -c Wheelchair-1.3.126.zip.sha256)

          target="$(git log --diff-filter=A --format=%H -- "$archive" | head -n1)"
          test -n "$target"
          echo "1.3.126 historical target: $target"

          if gh release view v1.3.126 >/dev/null 2>&1; then
            echo 'v1.3.126 already exists; refusing duplicate'
            exit 1
          fi

          work="$RUNNER_TEMP/wheelchair-1.3.126"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          src="$work/Wheelchair-1.3.126"
          notes="$RUNNER_TEMP/release-1.3.126.md"

          if [ -f "$src/RELEASE_NOTES_1_3_126.md" ]; then
            cp "$src/RELEASE_NOTES_1_3_126.md" "$notes"
          elif [ -f "$src/RELEASE_NOTES.md" ]; then
            cp "$src/RELEASE_NOTES.md" "$notes"
          else
            cat > "$notes" <<'EOF'
          # Wheelchair 1.3.126

          Wheelchair 1.3.126 release assets restored from the repository `dist/` archive.

          SHA-256: `d2ed180aa9825761b2d3237fa0c4142147b482930bd26b09c32b25b46c2a9f9f`
          EOF
          fi

          gh release create v1.3.126 \
            "$archive" "$checksum_file" \
            --target "$target" \
            --title 'Wheelchair 1.3.126' \
            --notes-file "$notes"

          git rm .github/workflows/release-1.3.126-restore.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore Wheelchair 1.3.126 release'
          git push origin HEAD:main
