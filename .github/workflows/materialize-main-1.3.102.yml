name: Materialize Wheelchair 1.3.102 production main

on:
  push:
    paths:
      - .github/workflows/materialize-main-1.3.102.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize versionless production tree
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/Wheelchair-1.3.102.zip"
          unpack="$(mktemp -d)"
          staging="$(mktemp -d)"

          test -f "$archive"
          unzip -q "$archive" -d "$unpack"

          src="$(find "$unpack" -maxdepth 2 -type f -name build.sh -printf '%h\n' | head -n 1)"
          test -n "$src"
          test -d "$src/compiler"
          test -d "$src/runtime"

          mkdir -p "$staging/main"
          for item in bin compiler runtime surface tools build.sh README.md; do
            test -e "$src/$item"
            cp -a "$src/$item" "$staging/main/"
          done

          mkdir -p main
          rsync -a --delete "$staging/main/" main/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f .github/workflows/materialize-main-1.3.102.yml
          git add -A main .github/workflows/materialize-main-1.3.102.yml

          if git diff --cached --quiet; then
            echo 'main/ already matches Wheelchair 1.3.102'
            exit 0
          fi

          git commit -m 'main: materialize versionless production tree from 1.3.102'
          git push origin HEAD:main
