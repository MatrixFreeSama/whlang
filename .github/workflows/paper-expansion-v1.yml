name: paper-expansion-v1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-expansion-v1.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run path-stable cross-mechanism experiments
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/paper_1_3_127/patch_expansion_v1_skip_he.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/paper_1_3_127/run_expansion_v1.py
          git commit -m 'Keep paper expansion to path-stable frozen mechanisms' || true
          git push origin HEAD:main
          python3 experiments/paper_1_3_127/run_expansion_v1.py
          echo '=== RESULTS ==='
          cat experiments/paper_1_3_127/expansion_v1_20261005/RESULTS.md
          git add experiments/paper_1_3_127/expansion_v1_20261005
          git rm -f experiments/paper_1_3_127/patch_expansion_v1_isa.py
          git rm -f experiments/paper_1_3_127/patch_expansion_v1_exec.py
          git rm -f experiments/paper_1_3_127/patch_expansion_v1_skip_he.py
          git rm .github/workflows/paper-expansion-v1.yml
          git commit -m 'Record Wheelchair 1.3.127 cross-mechanism paper results'
          git push origin HEAD:main
