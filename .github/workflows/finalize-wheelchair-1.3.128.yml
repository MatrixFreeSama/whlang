name: finalize-wheelchair-1.3.128
on:
  push:
    paths:
      - '.github/workflows/finalize-wheelchair-1.3.128.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proven CoordinateFact aging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/field-coordinatefact-128-test.yml').read_text().splitlines()
          code=[]; inside=False
          for line in lines:
              if not inside and line.strip()=="python3 - <<'PY'":
                  inside=True; continue
              if inside and line.strip()=='PY': break
              if inside: code.append(line[10:] if line.startswith('          ') else line)
          if not code: raise SystemExit('candidate patch unavailable')
          exec('\n'.join(code),{})
          PY
      - name: Converge dead generic authorities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The canonical packet CoordinateFact makes the old AVX2 offset-vector
          # stack namespace and runtime load helper dead. Delete them rather than
          # retain compatibility-shaped interiors.
          p=Path('main/compiler/field_frontend_common_x86_64.S')
          s=p.read_text()

          # Delete coord offset store/load emitters. Logical ff_coord_count remains
          # canonical compile-time AddressFact grouping metadata, but no longer owns
          # physical frame bytes.
          pat=r'''# Coordinate offset stack slots live after all value-cache slots\.\nff_emit_coord_store:\n.*?\n(?=# Direct regular-neighborhood load\.)'''
          # Keep helpers after coord load which are unrelated. Narrow manually at next marker.
          a=s.index('# Coordinate offset stack slots live after all value-cache slots.')
          b=s.index('# Direct regular-neighborhood load.',a)
          block=s[a:b]
          # Preserve field-base/address-pool helpers between coord helpers and direct load.
          # Remove only the two tiny coord emitter functions.
          block2=re.sub(r'''# Coordinate offset stack slots live after all value-cache slots\.\nff_emit_coord_store:\n.*?\nff_emit_coord_load:\n.*?\n    ret\n''','',block,flags=re.S)
          if block2==block: raise SystemExit('coord emitter block not found')
          s=s[:a]+block2+s[b:]

          # No physical coord-offset vectors survive, so constants/address pools no
          # longer reserve ff_coord_count * lane bytes. All occurrences here are
          # frame-address arithmetic; logical coord loops use cmp and are untouched.
          n=s.count('    add edi,dword ptr [rip+ff_coord_count]\n')
          if n < 4: raise SystemExit(f'unexpected frame coord additions {n}')
          s=s.replace('    add edi,dword ptr [rip+ff_coord_count]\n','')
          n2=s.count('    add esi,dword ptr [rip+ff_coord_count]\n')
          s=s.replace('    add esi,dword ptr [rip+ff_coord_count]\n','')

          # Dead runtime load selector: all generated loads now consume the single
          # AddressFact relation then direct gather/direct Region load.
          s,n3=re.subn(r'''\nff_runtime_load_va_for_access:\n    cmp edi,dword ptr \[rip\+ff_access_count\]\n    jae \.ffrvl_bad\n    mov rax,FIELD_RUNTIME_LOAD_VA\n    ret\n\.ffrvl_bad:\n    xor eax,eax\n    ret\n''','\n',s,count=1)
          if n3!=1: raise SystemExit('runtime load selector not found')
          p.write_text(s)

          # Remove runtime field_load_f32 from both physical profiles. The store
          # helper remains for truthful generic mutable output; load is dead.
          for fn in ['main/runtime/field_runtime_256_x86_64.S','main/runtime/field_runtime_512_x86_64.S']:
              p=Path(fn); s=p.read_text()
              a=s.index('.global field_load_f32')
              b=s.index('.global field_store_f32',a)
              s=s[:a]+s[b:]
              p.write_text(s)

          # Offset generator no longer exports a dead load authority.
          p=Path('main/tools/generate_field_runtime_offsets.sh'); s=p.read_text()
          s=s.replace('va_load=$(need field_load_f32)\n','')
          s=s.replace('.equ FIELD_RUNTIME_LOAD_VA, $va_load\n','')
          p.write_text(s)

          # Add hard gates: no old physical coord-offset stack transport, no generic
          # runtime load authority, no benchmark route/matcher.
          p=Path('main/build.sh'); s=p.read_text()
          gate='''\n# 1.3.128 native256 CoordinateFact aging. Register pressure may change the\n# physical carrier but may not duplicate the semantic fact per AddressFact.\ngrep -q 'ff_packet_coord_stack_off:' compiler/field_frontend_common_x86_64.S\ngrep -q 'canonical packet CoordinateFact' runtime/field_runtime_256_x86_64.S\n! grep -q '^ff_emit_coord_store:' compiler/field_frontend_common_x86_64.S\n! grep -q '^ff_emit_coord_load:' compiler/field_frontend_common_x86_64.S\n! grep -q '^ff_runtime_load_va_for_access:' compiler/field_frontend_common_x86_64.S\n! grep -q '^\\.global field_load_f32$' runtime/field_runtime_256_x86_64.S\n! grep -q '^\\.global field_load_f32$' runtime/field_runtime_512_x86_64.S\n! grep -q 'FIELD_RUNTIME_LOAD_VA' tools/generate_field_runtime_offsets.sh compiler/field_frontend_common_x86_64.S\n! grep -RqsE 'miniamr|minife|stencil[ _-]*(route|matcher)|extent[ _-]*(threshold|class)|nonpow2[ _-]*(backend|route)' compiler runtime tools\necho 'CANONICAL_PACKET_COORDINATEFACT_1_3_128=PASS'\necho 'ADDRESSFACT_RUNTIME_REDERIVATION_AUTHORITY=0'\necho 'FIELD_GENERIC_LOAD_HELPER_AUTHORITY=0'\necho 'COORDINATE_OFFSET_STACK_TRANSPORT=0'\necho 'WHEELCHAIR_1_3_128_BUILD=PASS'\n'''
          s += gate
          p.write_text(s)
          PY
      - name: Build and final A/B gate
        shell: bash
        run: |
          set -euo pipefail
          cd main
          bash build.sh | tee /tmp/build128.log
          grep -q 'CANONICAL_PACKET_COORDINATEFACT_1_3_128=PASS' /tmp/build128.log
      - name: Benchmark final source against 1.3.127 and C
        shell: bash
        run: |
          python3 - <<'PY'
          import array,csv,json,os,statistics,struct,subprocess,tempfile,time,zipfile
          from pathlib import Path
          ROOT=Path.cwd(); CPU=min(os.sched_getaffinity(0)); REPS=9; SIZES=(160,192,224,256)
          outdir=ROOT/'experiments'/'paper_1_3_128'/'coordinatefact_aging_20261005'; outdir.mkdir(parents=True,exist_ok=True)
          def run(cmd,cwd=None):
              cp=subprocess.run(cmd,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if cp.returncode: raise RuntimeError(f'{cmd}\n{cp.stdout}\n{cp.stderr}')
              return cp
          def timed(cmd):
              t=time.perf_counter_ns(); cp=subprocess.run(['taskset','-c',str(CPU)]+cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE); ms=(time.perf_counter_ns()-t)/1e6
              if cp.returncode: raise RuntimeError(f'{cmd}\n{cp.stdout}\n{cp.stderr}')
              return ms,cp.stdout.strip()
          def field(path,n):
              total=n**3; h=bytearray(256); h[:8]=b'WHFLD217'; struct.pack_into('<I',h,8,2); struct.pack_into('<I',h,12,1); struct.pack_into('<Q',h,16,3); struct.pack_into('<Q',h,24,256); struct.pack_into('<Q',h,32,total)
              for i,x in enumerate((n,n,n)): struct.pack_into('<Q',h,64+8*i,x)
              for i,x in enumerate((n*n*4,n*4,4)): struct.pack_into('<Q',h,88+8*i,x)
              vals=array.array('f',(((i*37+11)&4095)/4096.0 for i in range(4096))); b=vals.tobytes(); q,r=divmod(total,4096)
              with path.open('wb') as f:
                  f.write(h)
                  for _ in range(q): f.write(b)
                  if r:f.write(b[:4*r])
          rows=[]; summary=[]
          with tempfile.TemporaryDirectory() as td:
              w=Path(td); pkg=w/'pkg'; pkg.mkdir()
              with zipfile.ZipFile(ROOT/'dist'/'Wheelchair-1.3.127.zip') as z:z.extractall(pkg)
              base=next(x for x in pkg.iterdir() if x.is_dir())
              for x in (base/'bin').iterdir():
                  if x.is_file(): x.chmod(x.stat().st_mode|0o111)
              src=base/'devtrash'/'benchmarks'/'real_sparse_1326'; fs={n:w/f'f{n}.whfld' for n in SIZES}
              for n,p in fs.items(): field(p,n)
              for stem,label in [('miniamr27','miniAMR_27point'),('minife_heat21','miniFE_heat21')]:
                  cfg=json.loads((src/f'{stem}.json').read_text()); cfg['contracts']['floating_point']='strict'; cp=w/f'{stem}.json'; cp.write_text(json.dumps(cfg,separators=(',',':')))
                  new=w/f'{stem}.128'; old=w/f'{stem}.127'; cc=w/f'{stem}.c'
                  run(['./bin/fieldc-native256',str(cp),'-o',str(new)],cwd=ROOT/'main'); run(['./bin/fieldc-native256',str(cp),'-o',str(old)],cwd=base)
                  run(['gcc','-O3','-march=x86-64-v3','-mtune=generic','-fno-fast-math','-ffp-contract=off',str(src/f'{stem}.c'),'-lm','-o',str(cc)])
                  for n in SIZES:
                      cmds={'Wheelchair_1.3.127':[str(old),str(fs[n])],'Wheelchair_1.3.128':[str(new),str(fs[n])],'GCC_C_strict_v3':[str(cc),str(fs[n]),str(n)]}
                      for c in cmds.values(): timed(c)
                      vals={k:[] for k in cmds}; outs={}; names=list(cmds)
                      for rep in range(REPS):
                          order=names[rep%3:]+names[:rep%3]
                          for oi,k in enumerate(order):
                              ms,stdout=timed(cmds[k]); vals[k].append(ms); outs[k]=stdout; rows.append([label,n,rep,oi,k,ms,stdout])
                      if outs['Wheelchair_1.3.127']!=outs['Wheelchair_1.3.128']: raise RuntimeError(f'checksum drift {label} {n}: {outs}')
                      med={k:statistics.median(v) for k,v in vals.items()}; mad={k:statistics.median(abs(x-med[k]) for x in v) for k,v in vals.items()}
                      summary.append([label,n,med['Wheelchair_1.3.127'],med['Wheelchair_1.3.128'],med['GCC_C_strict_v3'],med['Wheelchair_1.3.127']/med['Wheelchair_1.3.128'],med['GCC_C_strict_v3']/med['Wheelchair_1.3.128'],mad['Wheelchair_1.3.128'],outs['Wheelchair_1.3.128']])
          with (outdir/'raw.csv').open('w',newline='') as f:
              w=csv.writer(f); w.writerow(['workload','n','rep','order','implementation','wall_ms','stdout']); w.writerows(rows)
          with (outdir/'summary.csv').open('w',newline='') as f:
              w=csv.writer(f); w.writerow(['workload','n','wc127_ms','wc128_ms','c_ms','speedup_128_over_127','speedup_128_over_C','wc128_MAD_ms','checksum']); w.writerows(summary)
          md=['# Wheelchair 1.3.128 native256 CoordinateFact aging','',f'One pinned CPU `{CPU}`, {REPS} interleaved repetitions, Strict FP, x86-64-v3/native256. 1.3.127 and 1.3.128 checksums are bit-identical at every point.','', '| workload | n | 1.3.127 ms | 1.3.128 ms | C ms | 128/127 speedup | 128/C speedup |','|---|---:|---:|---:|---:|---:|---:|']
          for r in summary: md.append(f'| {r[0]} | {r[1]} | {r[2]:.6f} | {r[3]:.6f} | {r[4]:.6f} | {r[5]:.3f}x | {r[6]:.3f}x |')
          md += ['','The change introduces no workload matcher, extent threshold, second Field backend, JIT, scheduler, or source-visible parallel construct. Native256 now retains one canonical packet CoordinateFact in an execution-local physical carrier; AddressFacts consume it instead of re-deriving Rank-N coordinates independently.','']
          (outdir/'RESULTS.md').write_text('\n'.join(md))
          print('\n'.join(md))
          PY
      - name: Prepare 1.3.128 package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.'); main=root/'main'; stage=root/'_release128'/'Wheelchair-1.3.128'
          if stage.parent.exists(): shutil.rmtree(stage.parent)
          stage.mkdir(parents=True)
          for item in main.iterdir():
              if item.name=='build': continue
              dst=stage/item.name
              if item.is_dir(): shutil.copytree(item,dst)
              else: shutil.copy2(item,dst)
          notes='''# Wheelchair 1.3.128 — Canonical Packet CoordinateFact Aging\n\nWheelchair 1.3.128 removes a native256 generic-Field physical redundancy exposed by the 1.3.127 paper experiment.\n\n- A generic AVX2 packet now owns one canonical Rank-N CoordinateFact. Register pressure changes its physical carrier to compact execution-local storage; it no longer causes every AddressFact to rediscover `q -> coordinates`.\n- AddressFacts consume the same packet CoordinateFact and perform only their necessary delta / periodic-wrap / physical-stride realization.\n- The obsolete AVX2 coordinate-offset stack transport and generic `field_load_f32` runtime authority are deleted rather than retained as compatibility paths.\n- No stencil or workload matcher, extent threshold/class, non-power-of-two backend, JIT, scheduler, parallel DSL surface, or benchmark-specific branch is introduced.\n- Direct Region execution, Strict floating-point order, RankFact, RegionFact, GroupFact, Physical DAG, execution admission, and heterogeneous-silicon authorities remain unchanged.\n- Strict 1.3.127 -> 1.3.128 checksums are bit-identical across the retained miniAMR-27 / miniFE-21 shape sweep.\n\nThe release is an architecture-aging repair: one semantic fact is materialized once and shared; carrier scarcity may alter placement but not multiply mathematical work.\n'''
          (stage/'RELEASE_NOTES_1_3_128.md').write_text(notes)
          # Package README gets an append-only release-head note without rewriting history.
          rp=stage/'README.md'; text=rp.read_text(); text=text.replace('Wheelchair 1.3.127','Wheelchair 1.3.128',1) if 'Wheelchair 1.3.127' in text else text
          rp.write_text(text)
          PY
          (cd _release128 && zip -qr ../dist/Wheelchair-1.3.128.zip Wheelchair-1.3.128)
          sha256sum dist/Wheelchair-1.3.128.zip > dist/Wheelchair-1.3.128.zip.sha256
      - name: Update repository README release head
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          z=Path('dist/Wheelchair-1.3.128.zip'); sha=hashlib.sha256(z.read_bytes()).hexdigest()
          p=Path('README.md'); s=p.read_text()
          s=s.replace('Wheelchair-1.3.127.zip','Wheelchair-1.3.128.zip')
          s=s.replace('1.3.127 paper snapshot','1.3.128')
          s=s.replace('**1.3.127**','**1.3.128**')
          s=re.sub(r'(?i)(SHA-256[^`\n]*`)[0-9a-f]{64}(`)',lambda m:m.group(1)+sha+m.group(2),s,count=1)
          marker='## Wheelchair 1.3.128\n\n1.3.128 ages native256 generic Field AddressFact realization into one canonical packet CoordinateFact: non-power-of-two neighborhood accesses no longer re-derive Rank-N coordinates independently. The old coordinate-offset stack transport and generic Field load helper are removed; no workload matcher, extent threshold, second backend, JIT, scheduler, or parallel DSL surface is added.\n\n'
          if '## Wheelchair 1.3.128' not in s:
              # Insert before first current-release-like section if possible, else after intro.
              i=s.find('\n## ',1); s=s[:i+1]+marker+s[i+1:] if i!=-1 else s+'\n'+marker
          p.write_text(s)
          print('sha256',sha)
          PY
      - name: Commit production source, experiment, zip and SHA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _release128
          rm -f .github/workflows/field-coordinatefact-128-test.yml .github/workflows/field-coordinatefact-128-bench.yml .github/workflows/finalize-wheelchair-1.3.128.yml
          git config user.name 'Wheelchair Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add main README.md dist/Wheelchair-1.3.128.zip dist/Wheelchair-1.3.128.zip.sha256 experiments/paper_1_3_128 .github/workflows
          git commit -m 'Release Wheelchair 1.3.128 canonical CoordinateFact aging'
          git push origin HEAD:main
