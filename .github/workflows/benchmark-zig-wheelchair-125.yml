name: Benchmark Zig vs Wheelchair 1.2.5 FSI

on:
  push:
    branches: [bench-1.2.5-zig-duel]
    paths:
      - 'worktree/**'
      - 'benchmarks/fluid_solid_coupling_124/Fluid_Solid_expert_C_matched.c'
      - 'benchmarks/fluid_solid_coupling_124/Fluid_Solid_zig_matched.zig'
      - 'benchmarks/fluid_solid_coupling_124/Fluid_Solid_zig_avx512.zig'
      - 'benchmarks/fluid_solid_coupling_124/fsi_coupled.whex'
      - '.github/workflows/benchmark-zig-wheelchair-125.yml'
  workflow_dispatch:

env:
  ZIG_VERSION: '0.16.0'

jobs:
  zig-compile-and-numeric-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Compile matched C and explicit-vector Zig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fsi125
          gcc -O3 -march=native -mtune=native -flto -ffast-math -pthread \
            -DCOUPLED_MODE=1 benchmarks/fluid_solid_coupling_124/Fluid_Solid_expert_C_matched.c \
            -o /tmp/fsi125/c
          zig build-exe benchmarks/fluid_solid_coupling_124/Fluid_Solid_zig_avx512.zig \
            -O ReleaseFast -mcpu=native -fllvm -femit-bin=/tmp/fsi125/zig
      - name: Numeric parity smoke gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, struct, subprocess
          def run(cmd):
              return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
          def val(s):
              m=re.search(r'0x([0-9a-fA-F]+)',s)
              if not m: raise SystemExit(f'missing checksum: {s!r}')
              return struct.unpack('>d',int(m.group(1),16).to_bytes(8,'big'))[0]
          for n in (4, 31, 32, 33, 4096, 65535, 65536, 65537, 100000):
              for q in (1,2,4):
                  c=run(['/tmp/fsi125/c',str(n),str(q)])
                  z=run(['/tmp/fsi125/zig',str(n),str(q)])
                  cv,zv=val(c),val(z)
                  rel=abs(zv-cv)/max(abs(cv),1.0)
                  print(f'N={n} Q={q} C={cv:.17g} ZIG={zv:.17g} REL={rel:.3e}')
                  if rel > 1e-8:
                      raise SystemExit(f'Zig numeric mismatch N={n} Q={q}: {c} vs {z}')
          print('ZIG_EXPLICIT_VECTOR_NUMERIC_GATE=PASS')
          PY

  authority:
    needs: zig-compile-and-numeric-gate
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build Wheelchair and qualify AVX-512 host
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          echo "SLOT=${{ matrix.slot }}" | tee /tmp/host.txt
          lscpu | grep -E 'Vendor ID|Model name|CPU family|^Model:|Socket|Thread|Core' | tee -a /tmp/host.txt || true
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualified=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Wheelchair 1.2.5, Expert C, and Expert Zig
        if: steps.qualify.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for q in 1 2 4; do
            ./whexc ../benchmarks/fluid_solid_coupling_124/fsi_coupled.whex \
              -o "build/fsi_coupled_125_q${q}" --executors "$q" >/dev/null
          done
          COMMON='-O3 -march=native -mtune=native -flto -ffast-math -mprefer-vector-width=512 -pthread'
          gcc $COMMON -DCOUPLED_MODE=1 \
            ../benchmarks/fluid_solid_coupling_124/Fluid_Solid_expert_C_matched.c \
            -o build/fsi_coupled_c512
          zig build-exe ../benchmarks/fluid_solid_coupling_124/Fluid_Solid_zig_avx512.zig \
            -O ReleaseFast -mcpu=native -fllvm -femit-bin=build/fsi_coupled_zig
          sha256sum ../benchmarks/fluid_solid_coupling_124/Fluid_Solid_zig_avx512.zig > /tmp/zig_source_sha256.txt
          objdump -d build/fsi_coupled_zig > /tmp/zig_avx512.asm
          if ! grep -Eq '\bzmm[0-9]+' /tmp/zig_avx512.asm; then
            echo 'ZIG_ZMM_GATE=FAIL: explicit 8xf64 source did not lower to any ZMM instruction' >&2
            exit 1
          fi
          echo 'ZIG_ZMM_GATE=PASS' > /tmp/zig_vector_witness.txt
          grep -m 12 -E '\bzmm[0-9]+' /tmp/zig_avx512.asm >> /tmp/zig_vector_witness.txt
      - name: Same-host Wheelchair vs Expert C vs Expert Zig authority
        if: steps.qualify.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 - <<'PY' | tee /tmp/authority.txt
          import math, os, random, re, statistics, struct, subprocess, time
          RUNS=11; WARM=3
          cpulist=sorted(os.sched_getaffinity(0))
          def cpus(q): return ','.join(map(str,cpulist[:q]))
          def run(c): return subprocess.check_output(c,text=True,stderr=subprocess.STDOUT).strip()
          def val(s):
              m=re.search(r'0x([0-9a-fA-F]+)',s)
              if not m: raise SystemExit(f'missing checksum: {s!r}')
              return struct.unpack('>d',int(m.group(1),16).to_bytes(8,'big'))[0]
          ratios_wc=[]; ratios_wz=[]; ratios_zc=[]
          rng=random.Random(0xE7A5125)
          for n in (10_000_000,100_000_000):
            for q in (1,2,4):
              cmds={
                'WHEELCHAIR':['taskset','-c',cpus(q),f'build/fsi_coupled_125_q{q}',str(n)],
                'C':['taskset','-c',cpus(q),'build/fsi_coupled_c512',str(n),str(q)],
                'ZIG':['taskset','-c',cpus(q),'build/fsi_coupled_zig',str(n),str(q)],
              }
              first={k:run(v) for k,v in cmds.items()}
              values={k:val(v) for k,v in first.items()}
              base=values['WHEELCHAIR']
              for k in ('C','ZIG'):
                rel=abs(values[k]-base)/max(abs(base),1.0)
                if rel>1e-8:
                  raise SystemExit(f'numeric mismatch {k} N={n} Q={q} rel={rel}: {first}')
              for c in cmds.values():
                for _ in range(WARM): run(c)
              samples={k:[] for k in cmds}
              for _ in range(RUNS):
                order=list(cmds); rng.shuffle(order)
                for k in order:
                  t=time.perf_counter_ns(); run(cmds[k]); samples[k].append((time.perf_counter_ns()-t)/1e6)
              med={k:statistics.median(v) for k,v in samples.items()}
              wc=med['WHEELCHAIR']/med['C']
              wz=med['WHEELCHAIR']/med['ZIG']
              zc=med['ZIG']/med['C']
              ratios_wc.append(wc); ratios_wz.append(wz); ratios_zc.append(zc)
              print(f'ROW MODE=coupled N={n} Q={q} WHEELCHAIR_MS={med["WHEELCHAIR"]:.6f} C512_MS={med["C"]:.6f} ZIG_AVX512_MS={med["ZIG"]:.6f} WHEELCHAIR_C={wc:.4f}x WHEELCHAIR_ZIG={wz:.4f}x ZIG_C={zc:.4f}x')
          def geo(xs): return math.exp(sum(math.log(x) for x in xs)/len(xs))
          print(f'COUPLED_GEOMEAN_WHEELCHAIR_OVER_C={geo(ratios_wc):.4f}x')
          print(f'COUPLED_GEOMEAN_WHEELCHAIR_OVER_ZIG_AVX512={geo(ratios_wz):.4f}x')
          print(f'COUPLED_GEOMEAN_ZIG_AVX512_OVER_C={geo(ratios_zc):.4f}x')
          print('ZIG_KIND=explicit_vector_8xf64')
          print('ZIG_WHEELCHAIR_125_NUMERIC_GATE=PASS')
          print('ZIG_WHEELCHAIR_125_AUTHORITY_HOST=PASS')
          PY
      - name: Seal authority artifact
        if: steps.qualify.outputs.qualified == 'true'
        shell: bash
        run: |
          cat /tmp/host.txt /tmp/probe.txt /tmp/zig_source_sha256.txt /tmp/zig_vector_witness.txt /tmp/authority.txt > /tmp/result.txt
          echo 'WHEELCHAIR_ZIG_FSI_1_2_5_HOST=PASS' >> /tmp/result.txt
      - uses: actions/upload-artifact@v4
        if: steps.qualify.outputs.qualified == 'true'
        with:
          name: zig-avx512-wheelchair-fsi-125-${{ matrix.slot }}
          path: /tmp/result.txt
          if-no-files-found: error
          retention-days: 30
