name: Materialize Wheelchair 1.2.2 baseline

on:
  push:
    branches:
      - build-1.2.2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact 1.2.1 release archive
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/Wheelchair-1.2.1.zip
          echo '8ed8f27125a47d816dbae8d56b6f71060d28e75b33ab76edb664596569884490  dist/Wheelchair-1.2.1.zip' | sha256sum -c -

      - name: Materialize verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf worktree /tmp/wheelchair-121
          mkdir -p worktree /tmp/wheelchair-121
          unzip -q dist/Wheelchair-1.2.1.zip -d /tmp/wheelchair-121
          root="$(find /tmp/wheelchair-121 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$root"
          test -f "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)
          cp -a "$root"/. worktree/
          printf '%s\n' '8ed8f27125a47d816dbae8d56b6f71060d28e75b33ab76edb664596569884490  Wheelchair-1.2.1.zip' > worktree/.BASELINE_1_2_1_ARCHIVE_SHA256

      - name: Commit materialized baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wheelchair-release-bot'
          git config user.email 'wheelchair-release-bot@users.noreply.github.com'
          git add worktree
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Materialize verified Wheelchair 1.2.1 baseline for 1.2.2'
          git push origin HEAD:build-1.2.2
