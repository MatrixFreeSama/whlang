name: repair-release-timeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-release-timeline.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete 1.3.126 release and restore missing 1.3.122
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/Wheelchair-1.3.122.zip"
          checksum_file="dist/Wheelchair-1.3.122.zip.sha256"
          (cd dist && sha256sum -c Wheelchair-1.3.122.zip.sha256)

          target="$(git log --diff-filter=A --format=%H -- "$archive" | head -n1)"
          test -n "$target"
          echo "1.3.122 historical target: $target"

          if gh release view v1.3.126 >/dev/null 2>&1; then
            gh release delete v1.3.126 --cleanup-tag -y
          fi

          work="$RUNNER_TEMP/wheelchair-1.3.122"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          src="$work/Wheelchair-1.3.122"
          notes="$RUNNER_TEMP/release-1.3.122.md"

          if [ -f "$src/RELEASE_NOTES_1_3_122.md" ]; then
            cp "$src/RELEASE_NOTES_1_3_122.md" "$notes"
          elif [ -f "$src/RELEASE_NOTES.md" ]; then
            cp "$src/RELEASE_NOTES.md" "$notes"
          else
            cat > "$notes" <<'EOF'
          # Wheelchair 1.3.122

          Wheelchair 1.3.122 release assets are restored from the repository `dist/` archive to complete the historical release timeline.

          The release is attached to the historical commit that first added `dist/Wheelchair-1.3.122.zip`, rather than to the current `main` head.

          SHA-256: `cdb18934a869c4c6e7f77cbb5938d4fb599575071c6ea5a610d23bbf0941913d`
          EOF
          fi

          if gh release view v1.3.122 >/dev/null 2>&1; then
            echo 'v1.3.122 already exists; refusing duplicate'
            exit 1
          fi

          gh release create v1.3.122 \
            "$archive" "$checksum_file" \
            --target "$target" \
            --title 'Wheelchair 1.3.122' \
            --notes-file "$notes"

          git rm .github/workflows/audit-release-timeline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete release timeline through Wheelchair 1.3.122'
          git push origin HEAD:main

          echo '=== FINAL RELEASE HEAD ==='
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=5" --jq '.[].tag_name'
