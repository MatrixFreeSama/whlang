name: Package Wheelchair 1.2.7 dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release trigger
        id: trigger
        shell: bash
        run: |
          if [ -f .release-trigger-1.2.7 ]; then
            echo 'active=1' >> "$GITHUB_OUTPUT"
          else
            echo 'active=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Package clean tracked release
        if: steps.trigger.outputs.active == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, subprocess, zipfile

          root = Path.cwd()
          version = '1.2.7'
          prefix = f'Wheelchair-{version}'
          stage = Path('/tmp') / prefix
          out = root / 'dist' / f'{prefix}.zip'
          sha = root / 'dist' / f'{prefix}.zip.sha256'

          shutil.rmtree(stage, ignore_errors=True)
          stage.mkdir(parents=True)
          files = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          for raw in files:
              if not raw:
                  continue
              rel = raw.decode('utf-8')
              if rel == '.release-trigger-1.2.7' or rel.startswith('dist/') or rel.startswith('.github/'):
                  continue
              src = root / rel
              if not src.is_file():
                  continue
              dst = stage / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          epoch = (2026, 9, 6, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(stage).as_posix()
                  info = zipfile.ZipInfo(f'{prefix}/{rel}', date_time=epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o755 if os.access(p, os.X_OK) else 0o644) << 16
                  zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          sha.write_text(f'{digest}  {out.name}\n', encoding='ascii')
          print(f'archive={out}')
          print(f'sha256={digest}')
          print(f'size={out.stat().st_size}')
          PY
          unzip -t dist/Wheelchair-1.2.7.zip
          sha256sum -c dist/Wheelchair-1.2.7.zip.sha256
      - name: Commit dist archive
        if: steps.trigger.outputs.active == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wheelchair-release-bot'
          git config user.email 'wheelchair-release-bot@users.noreply.github.com'
          git rm -f .release-trigger-1.2.7
          git add dist/Wheelchair-1.2.7.zip dist/Wheelchair-1.2.7.zip.sha256
          git commit -m 'Publish Wheelchair 1.2.7 dist archive'
          git push origin HEAD:main
