name: record-thermo-damage-benchmark-128
on:
  push:
    branches: [main]
    paths: ['.github/workflows/record-thermo-damage-benchmark-128.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore measured experiment
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, tarfile
          from pathlib import Path
          payload = ''''''
          data = base64.b64decode(payload)
          target = Path('experiments/paper_1_3_128/thermo_elastoplastic_damage_20261005')
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as tf:
              tf.extractall(target)
          PY
      - name: Commit experiment and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/paper_1_3_128/thermo_elastoplastic_damage_20261005
          git rm .github/workflows/record-thermo-damage-benchmark-128.yml
          git commit -m 'Record thermo-elastoplastic-damage benchmark for 1.3.128'
          git push
