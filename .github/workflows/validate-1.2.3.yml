name: Validate Wheelchair 1.2.3 Sparse Causal Expansion
# authority-trigger: 4-root-temp-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-1.2.3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_BRANCH: build-1.2.3

jobs:
  authority:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1, 2, 3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0
      - name: Apply 1.2.3 semantic integration
        run: |
          cd worktree
          python3 tools/apply_123.py
      - name: Build protected native lanes
        run: |
          cd worktree
          sh build.sh
      - name: Probe ISA
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          ./build/topologyc --probe | tee /tmp/probe.txt
          ./build/topologyc --isa-capabilities | tee /tmp/caps.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
            echo 'AVX512_RELEASE_HOST=QUALIFIED'
          else
            echo 'qualified=false' >> "$GITHUB_OUTPUT"
            echo 'AVX512_RELEASE_HOST=NOT_QUALIFIED'
          fi
      - name: Run monolithic 1.2.3 authority
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          sh test_complete_123.sh | tee /tmp/release-gates-123.txt
          grep -q '^WHEELCHAIR_SPARSE_CAUSAL_EXPANSION_1_2_3=PASS$' /tmp/release-gates-123.txt
          grep -q '^WHEELCHAIR_1_2_3_COMPLETE=PASS$' /tmp/release-gates-123.txt
      - name: Record authority
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          {
            echo "RELEASE_COMMIT=$(git rev-parse HEAD)"
            echo "RUNNER_IMAGE=${{ matrix.image }}"
            echo "RUNNER_SLOT=${{ matrix.slot }}"
            cat /tmp/probe.txt
            cat /tmp/caps.txt
            cat /tmp/release-gates-123.txt
          } > "/tmp/sce123-${{ matrix.image }}-${{ matrix.slot }}.txt"
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: sce123-${{ matrix.image }}-${{ matrix.slot }}
          path: /tmp/sce123-${{ matrix.image }}-${{ matrix.slot }}.txt
          if-no-files-found: error
          retention-days: 30

  quorum:
    needs: authority
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Reject qualified-host failures
        run: test '${{ needs.authority.result }}' != 'failure'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sce123-*
          path: authority
          merge-multiple: true
      - name: Require one full authority
        shell: bash
        run: |
          set -euo pipefail
          count=$(find authority -type f -name 'sce123-*.txt' 2>/dev/null | wc -l)
          test "$count" -ge 1
          grep -R -q '^WHEELCHAIR_SPARSE_CAUSAL_EXPANSION_1_2_3=PASS$' authority
          grep -R -q '^WHEELCHAIR_1_2_3_COMPLETE=PASS$' authority
          echo "WHEELCHAIR_1_2_3_AUTHORITY_RECORDS=$count"
          echo 'WHEELCHAIR_1_2_3_RELEASE_AUTHORITY=PASS'
