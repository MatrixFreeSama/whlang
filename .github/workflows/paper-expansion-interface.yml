name: paper-expansion-interface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-expansion-interface.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect interfaces
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/w127"; mkdir -p "$tmp"; unzip -q dist/Wheelchair-1.3.127.zip -d "$tmp"
          root="$tmp/Wheelchair-1.3.127"
          echo '=== REAL SPARSE README ==='; cat "$root/devtrash/benchmarks/real_sparse_1326/README.md"
          for f in miniamr27.c miniamr27.f90 minife_heat21.c minife_heat21.f90; do echo "=== $f ==="; sed -n '1,260p' "$root/devtrash/benchmarks/real_sparse_1326/$f"; done
          echo '=== PERIODIC C ==='; sed -n '1,260p' "$root/devtrash/benchmarks/periodic_affine_aging_13124/affine_natural.c"
          echo '=== PERIODIC F90 ==='; sed -n '1,300p' "$root/devtrash/benchmarks/periodic_affine_aging_13124/affine_natural_generic.f90"
          echo '=== PERIODIC CEILING C ==='; sed -n '1,260p' "$root/devtrash/benchmarks/periodic_affine_aging_13124/affine_ceiling.c"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/paper-expansion-interface.yml
          git commit -m 'Complete paper benchmark interface inspection'
          git push origin HEAD:main
