name: Inspect main materialize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-main-materialize.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest release archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wh98 /tmp/wh98.zip
          gh release download v1.3.98 -p 'Wheelchair-1.3.98.zip' -O /tmp/wh98.zip
          mkdir -p /tmp/wh98
          unzip -q /tmp/wh98.zip -d /tmp/wh98
          echo '=== TOP ==='
          find /tmp/wh98 -mindepth 1 -maxdepth 2 -printf '%y %P\n' | sort | head -n 400
          echo '=== DEPTH4 ==='
          find /tmp/wh98 -mindepth 1 -maxdepth 4 -printf '%y %P\n' | sort | head -n 800
          echo '=== SIZES ==='
          du -ah /tmp/wh98 | sort -h | tail -n 80
