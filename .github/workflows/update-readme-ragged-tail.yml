name: Update README representative benchmark

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-readme-ragged-tail.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path("README.md")
          s = p.read_text()

          s = s.replace("> Current release: **1.3.97**", "> Current release: **1.3.98**", 1)
          s = s.replace("[Download Wheelchair 1.3.97](./dist/Wheelchair-1.3.97.zip)", "[Download Wheelchair 1.3.98](./dist/Wheelchair-1.3.98.zip)", 1)
          s = s.replace("d43d463a3ca613eaf44eb0e5ec57fb41ca8477b914546ae3fdcee4078465625e", "9943448a486c4dd52733ea7a18a7149fd28259005d05d79c0448a40e44b72cd0", 1)
          s = s.replace("unzip Wheelchair-1.3.97.zip\ncd Wheelchair-1.3.97", "unzip Wheelchair-1.3.98.zip\ncd Wheelchair-1.3.98", 1)

          marker = "## Benchmark policy\n"
          title = "## Representative benchmark: ragged-tail idle conversion"
          section = base64.b64decode("").decode()
          if title not in s:
              if marker not in s:
                  raise SystemExit("benchmark policy marker not found")
              s = s.replace(marker, section + marker, 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'README already up to date'
            exit 0
          fi
          git commit -m 'README: add representative ragged-tail benchmark'
          git push origin HEAD:main
