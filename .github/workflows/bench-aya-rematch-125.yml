name: Wheelchair 1.2.5 vs Aya 0.41 Toggle Rematch

on:
  push:
    branches: [bench-aya-rematch-1.2.5]
    paths:
      - '.github/workflows/bench-aya-rematch-125.yml'

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-aya-rematch-1.2.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Wheelchair 1.2.5 and qualify host
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aya-rematch
          {
            echo 'SLOT=${{ matrix.slot }}'
            lscpu | grep -E 'Vendor ID|Model name|CPU family|^Model:|Socket|Thread|Core' || true
            java -version 2>&1 | head -3
          } | tee /tmp/aya-rematch/host.txt
          cd worktree
          sh build.sh
          ./build/topologyc --probe | tee /tmp/aya-rematch/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/aya-rematch/probe.txt; then
            echo 'qualified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'qualified=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Wheelchair contestant
        if: steps.probe.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          ./wheelchairc ../benchmarks/aya_toggle_rematch_125/toggle.wh -o build/aya_toggle_wh --executors 1 | tee /tmp/aya-rematch/wh_compile.json
          ./build/aya_toggle_wh 1 100000 | tee /tmp/aya-rematch/wh_smoke.txt

      - name: Build Aya 0.41.0-SNAPSHOT at pinned current commit
        if: steps.probe.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/aya-prover/aya-dev.git /tmp/aya-dev
          cd /tmp/aya-dev
          git checkout 5296b348775881e3c797bbc8d1c898a1ac959e00
          ./gradlew :cli-console:installDist --no-daemon -x test
          AYA=/tmp/aya-dev/cli-console/build/install/cli-console/bin/cli-console
          "$AYA" --version | tee /tmp/aya-rematch/aya_version.txt
          "$AYA" "$GITHUB_WORKSPACE/benchmarks/aya_toggle_rematch_125/toggle.aya" --no-color | tee /tmp/aya-rematch/aya_compile.txt

      - name: Install benchmark interaction helper
        if: steps.probe.outputs.qualified == 'true'
        run: python -m pip install --disable-pip-version-check --no-input pexpect

      - name: Benchmark both contestants
        if: steps.probe.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/aya-rematch/result.txt
          import os, re, statistics, subprocess, time
          from pathlib import Path
          import pexpect

          root=Path(os.environ['GITHUB_WORKSPACE'])
          wh=root/'worktree/build/aya_toggle_wh'
          aya=Path('/tmp/aya-dev/cli-console/build/install/cli-console/bin/cli-console')
          src=root/'benchmarks/aya_toggle_rematch_125/toggle.aya'
          cases=(100_000,1_000_000)

          def cpus1(): return str(sorted(os.sched_getaffinity(0))[0])
          cpu=cpus1()
          def wh_cmd(n): return ['taskset','-c',cpu,str(wh),'1',str(n)]
          def wh_run(n): return subprocess.check_output(wh_cmd(n),text=True).strip()

          wh_results={}
          for n in cases:
            first=wh_run(n)
            if not first.endswith('1'):
              raise SystemExit(f'Wheelchair wrong even-parity result N={n}: {first!r}')
            for _ in range(5): wh_run(n)
            xs=[]
            for _ in range(21):
              t=time.perf_counter_ns(); out=wh_run(n); dt=(time.perf_counter_ns()-t)/1e6
              if out != first: raise SystemExit('Wheelchair output drift')
              xs.append(dt)
            wh_results[n]=(statistics.median(xs),first,xs)

          child=pexpect.spawn('taskset',[ '-c',cpu,str(aya),'--repl','--repl-type','plain','--no-color'],encoding='utf-8',timeout=180,maxread=65536)
          child.expect_exact('> ')
          child.sendline(f':load {src}')
          child.expect_exact('> ')
          child.sendline(':normalize FULL')
          child.expect_exact('> ')

          def aya_eval(n):
            t=time.perf_counter_ns()
            child.sendline(f'toggleN {n} true')
            child.expect_exact('> ')
            dt=(time.perf_counter_ns()-t)/1e6
            out=child.before.strip()
            if 'true' not in out.lower():
              raise SystemExit(f'Aya wrong even-parity result N={n}: {out!r}')
            return dt,out

          aya_results={}
          for n in cases:
            for _ in range(3): aya_eval(n)
            xs=[]; last=''
            for _ in range(7):
              dt,last=aya_eval(n); xs.append(dt)
            aya_results[n]=(statistics.median(xs),last,xs)
          child.sendline(':quit')
          child.close(force=True)

          def metrics(p):
            s=p.read_text(encoding='utf-8')
            lines=[x for x in s.splitlines() if x.strip()]
            return len(lines),len(s.encode()),len(re.sub(r'\s+','',s))
          whm=metrics(root/'benchmarks/aya_toggle_rematch_125/toggle.wh')
          ayam=metrics(src)

          print(f'CPU={subprocess.check_output(["bash","-lc","lscpu | sed -n \"s/^Model name:[[:space:]]*//p\" | head -1"],text=True).strip()}')
          print(f'PINNED_CPU={cpu}')
          print(f'WH_SOURCE_NONBLANK_LOC={whm[0]} WH_SOURCE_BYTES={whm[1]} WH_SOURCE_NONWS_CHARS={whm[2]}')
          print(f'AYA_SOURCE_NONBLANK_LOC={ayam[0]} AYA_SOURCE_BYTES={ayam[1]} AYA_SOURCE_NONWS_CHARS={ayam[2]}')
          for n in cases:
            wm,wo,wx=wh_results[n]; am,ao,ax=aya_results[n]
            print(f'RESULT N={n} WH_MEDIAN_MS={wm:.6f} AYA_WARM_FULL_MEDIAN_MS={am:.6f} AYA_OVER_WH={am/wm:.2f}x')
            print('WH_SAMPLES_MS='+','.join(f'{x:.6f}' for x in wx))
            print('AYA_SAMPLES_MS='+','.join(f'{x:.6f}' for x in ax))
          print('TIMING_BOUNDARY_WH=whole_static_process_start_to_exit')
          print('TIMING_BOUNDARY_AYA=warm_same_REPL_expression_send_to_prompt_return_FULL_normalization')
          print('AYA_COMMIT=5296b348775881e3c797bbc8d1c898a1ac959e00')
          print('WHEELCHAIR_VERSION=1.2.5')
          print('AYA_TOGGLE_REMATCH=PASS')
          PY

      - name: Upload qualified result
        if: steps.probe.outputs.qualified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aya-rematch-${{ matrix.slot }}
          path: |
            /tmp/aya-rematch/host.txt
            /tmp/aya-rematch/probe.txt
            /tmp/aya-rematch/wh_compile.json
            /tmp/aya-rematch/aya_version.txt
            /tmp/aya-rematch/result.txt
          if-no-files-found: error
          retention-days: 30
