name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          lscpu
          unzip -q dist/Wheelchair-1.3.127.zip -d /tmp/w127
          W=/tmp/w127/Wheelchair-1.3.127
          chmod +x "$W/bin/wheelchairc"
          file "$W/bin/wheelchairc"
          ldd "$W/bin/wheelchairc" || true
          echo '=== version from repo cwd ==='
          "$W/bin/wheelchairc" --version
          echo "rc=$?"
          echo '=== version from package cwd ==='
          cd "$W"
          ./bin/wheelchairc --version
          echo "rc=$?"
          echo '=== compile from package cwd ==='
          ./bin/wheelchairc devtrash/benchmarks/math_generalization_1344/mass3.wh -o /tmp/mass3
          echo "rc=$?"
          file /tmp/mass3 || true
