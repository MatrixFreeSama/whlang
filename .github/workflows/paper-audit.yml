name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          rm -rf /tmp/w127src
          unzip -q dist/Wheelchair-1.3.127.zip -d /tmp/w127src
          W=/tmp/w127src/Wheelchair-1.3.127
          for f in \
            "$W/devtrash/benchmarks/localized_plasticity_13127/plasticity.whex" \
            "$W/devtrash/benchmarks/localized_plasticity_13127/plasticity.c" \
            "$W/devtrash/benchmarks/localized_plasticity_13127/plasticity.f90" \
            "$W/devtrash/benchmarks/localized_plasticity_13127/plasticity_ceiling.c" \
            "$W/devtrash/benchmarks/levelset_regionset_13126/levelset_two_regions.whex" \
            "$W/devtrash/benchmarks/levelset_regionset_13126/levelset.c" \
            "$W/devtrash/benchmarks/levelset_regionset_13126/levelset.f90" \
            "$W/devtrash/benchmarks/levelset_regionset_13126/levelset_ceiling.c"; do
            echo "===== FILE: $f ====="
            sed -n '1,260p' "$f"
          done
