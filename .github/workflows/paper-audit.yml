name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          rm -rf /tmp/w127proto
          unzip -q dist/Wheelchair-1.3.127.zip -d /tmp/w127proto
          W=/tmp/w127proto/Wheelchair-1.3.127
          for d in \
            "$W/devtrash/benchmarks/localized_plasticity_13127" \
            "$W/devtrash/benchmarks/levelset_regionset_13126"; do
            echo "===== DIRECTORY: $d ====="
            find "$d" -maxdepth 1 -type f -printf '%f\n' | sort
            for f in "$d"/README.md "$d"/*.py "$d"/*.sh; do
              [ -f "$f" ] || continue
              echo "===== FILE: $f ====="
              sed -n '1,320p' "$f"
            done
          done
