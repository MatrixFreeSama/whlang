name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          rm -rf /tmp/w127_short experiments/paper_1_3_127/pilot_20261005/_probe
          unzip -q dist/Wheelchair-1.3.127.zip -d /tmp/w127_short
          mkdir -p experiments/paper_1_3_127/pilot_20261005/_probe
          unzip -q dist/Wheelchair-1.3.127.zip -d experiments/paper_1_3_127/pilot_20261005/_probe
          S=/tmp/w127_short/Wheelchair-1.3.127
          L="$PWD/experiments/paper_1_3_127/pilot_20261005/_probe/Wheelchair-1.3.127"
          chmod +x "$S/bin/wheelchairc" "$L/bin/wheelchairc"
          echo "short cwd=$S len=${#S}"
          cd "$S"
          ./bin/wheelchairc devtrash/benchmarks/math_generalization_1344/mass3.wh -o /tmp/mass3_short
          echo "short rc=$?"
          cd "$GITHUB_WORKSPACE"
          echo "long cwd=$L len=${#L}"
          cd "$L"
          ./bin/wheelchairc devtrash/benchmarks/math_generalization_1344/mass3.wh -o /tmp/mass3_long
          echo "long rc=$?"
          cd "$GITHUB_WORKSPACE"
          echo '=== output-path A/B under short cwd ==='
          cd "$S"
          ./bin/wheelchairc devtrash/benchmarks/math_generalization_1344/mass3.wh -o "$GITHUB_WORKSPACE/experiments/paper_1_3_127/pilot_20261005/mass3_long_out"
          echo "long output rc=$?"
          file /tmp/mass3_short /tmp/mass3_long "$GITHUB_WORKSPACE/experiments/paper_1_3_127/pilot_20261005/mass3_long_out" 2>/dev/null || true
