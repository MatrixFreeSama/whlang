name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          B="$GITHUB_WORKSPACE/experiments/paper_1_3_127/pilot_20261005/_build"
          rm -rf "$B"
          mkdir -p "$B/w1_3_127" "$B/general_mass3"
          unzip -q dist/Wheelchair-1.3.127.zip -d "$B/w1_3_127"
          W="$B/w1_3_127/Wheelchair-1.3.127"
          chmod +x "$W/bin/wheelchairc"
          echo "cwd=$W"
          echo "src=devtrash/benchmarks/math_generalization_1344/mass3.wh"
          echo "out=$B/general_mass3/wheelchair"
          cd "$W"
          ./bin/wheelchairc devtrash/benchmarks/math_generalization_1344/mass3.wh -o "$B/general_mass3/wheelchair"
          echo "shell exact rc=$?"
          file "$B/general_mass3/wheelchair" 2>/dev/null || true
          rm -f "$B/general_mass3/wheelchair"
          echo '=== same argv via Python subprocess ==='
          python3 - "$W" "$B/general_mass3/wheelchair" <<'PY'
          import subprocess,sys,os
          cwd,out=sys.argv[1:]
          cmd=['./bin/wheelchairc','devtrash/benchmarks/math_generalization_1344/mass3.wh','-o',out]
          print('cmd repr=',repr(cmd),'cwd=',repr(cwd))
          cp=subprocess.run(cmd,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          print('python rc=',cp.returncode,'stdout=',repr(cp.stdout),'stderr=',repr(cp.stderr))
          PY
          file "$B/general_mass3/wheelchair" 2>/dev/null || true
