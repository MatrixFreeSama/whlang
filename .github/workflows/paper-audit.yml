name: paper-audit
on:
  push:
    paths: ['.github/workflows/paper-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q dist/Wheelchair-1.3.127.zip -d /tmp/w127
          R=/tmp/w127/Wheelchair-1.3.127/devtrash/benchmarks
          for f in \
            "$R/general_whole_episode_1316/REPORT.md" \
            "$R/general_whole_episode_1316/README.md" \
            "$R/real_sparse_1326/README.md" \
            "$R/levelset_regionset_13126/README.md" \
            "$R/localized_plasticity_13127/README.md" \
            "$R/math_generalization_1344/build_three_kernel_threeway.sh" \
            "$R/math_generalization_1344/run_three_kernel_threeway.py"; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,260p' "$f"; fi
          done
