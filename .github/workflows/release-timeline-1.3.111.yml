name: Wheelchair release timeline repair

on:
  push:
    paths:
      - '.github/workflows/release-timeline-1.3.111.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild release timeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-timeline-1.3.111.sh
