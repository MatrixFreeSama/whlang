name: sparse structural intel probe once
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/sparse-structural-intel-probe-once.yml']
permissions:
  contents: write
jobs:
  bench:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3,4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe and benchmark
        shell: bash
        run: |
          set -euo pipefail
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          echo "CPU=$model"
          case "$model" in *Intel*|*INTEL*) ;; *) echo 'SKIP_NON_INTEL'; exit 0;; esac
          cd Wheelchair-1.2.14
          chmod +x bin/whexc bin/topologyc* || true
          ./bin/whexc benchmarks/caretaker_1214/irregular_sparse.whex -o /tmp/wh --executors 1
          cat >/tmp/ca.c <<'EOF'
          #define _POSIX_C_SOURCE 200809L
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          int main(int c,char**v){uint64_t n=strtoull(v[1],0,10);double*x=0;if(posix_memalign((void**)&x,64,n*sizeof(double)))return 3;
          #pragma omp simd
          for(uint64_t i=0;i<n;i++)x[i]=-.375+(double)((i*31u+5u)%1024u)/1024.;double s=0.;
          #pragma omp simd reduction(+:s)
          for(uint64_t i=0;i<n;i++){uint64_t a1=(i*97u+17u)%n,a2=(i*193u+31u)%n,a3=(i*389u+47u)%n,a4=(i*769u+71u)%n,a5=(i*1543u+101u)%n,a6=(i*3079u+131u)%n,a7=(i*6151u+167u)%n,a8=(i*12289u+211u)%n,a9=(i*24593u+257u)%n,a10=(i*49157u+313u)%n;double z=x[i],p=x[a1],q=x[a10];s+=1.25*z-.125*p+.0625*x[a2]-.03125*x[a3]+.015625*x[a4]-.0078125*x[a5]+.00390625*x[a6]-.001953125*x[a7]+.0009765625*x[a8]-.00048828125*x[a9]+.000244140625*q+.0078125*z*z*z+.00390625*p*q;}printf("%.17g\n",s);free(x);}
          EOF
          cat >/tmp/cf.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          static inline double xval(uint64_t i){return -.375+(double)((i*31u+5u)%1024u)/1024.;}
          int main(int c,char**v){uint64_t n=strtoull(v[1],0,10);double s=0.;
          #pragma omp simd reduction(+:s)
          for(uint64_t i=0;i<n;i++){uint64_t a1=(i*97u+17u)%n,a2=(i*193u+31u)%n,a3=(i*389u+47u)%n,a4=(i*769u+71u)%n,a5=(i*1543u+101u)%n,a6=(i*3079u+131u)%n,a7=(i*6151u+167u)%n,a8=(i*12289u+211u)%n,a9=(i*24593u+257u)%n,a10=(i*49157u+313u)%n;double z=xval(i),p=xval(a1),q=xval(a10);s+=1.25*z-.125*p+.0625*xval(a2)-.03125*xval(a3)+.015625*xval(a4)-.0078125*xval(a5)+.00390625*xval(a6)-.001953125*xval(a7)+.0009765625*xval(a8)-.00048828125*xval(a9)+.000244140625*q+.0078125*z*z*z+.00390625*p*q;}printf("%.17g\n",s);}
          EOF
          cat >/tmp/fa.f90 <<'EOF'
          program s
          use iso_fortran_env,only:int64,real64
          implicit none
          integer(int64)::n,i,a1,a2,a3,a4,a5,a6,a7,a8,a9,a10
          real(real64),allocatable::x(:)
          real(real64)::sum,z,p,q
          character(len=64)::arg
          call get_command_argument(1,arg);read(arg,*)n;allocate(x(0:n-1))
          !$omp simd
          do i=0,n-1;x(i)=-.375_real64+real(mod(i*31_int64+5_int64,1024_int64),real64)/1024._real64;end do
          sum=0._real64
          !$omp simd reduction(+:sum)
          do i=0,n-1
          a1=mod(i*97_int64+17_int64,n);a2=mod(i*193_int64+31_int64,n);a3=mod(i*389_int64+47_int64,n);a4=mod(i*769_int64+71_int64,n);a5=mod(i*1543_int64+101_int64,n);a6=mod(i*3079_int64+131_int64,n);a7=mod(i*6151_int64+167_int64,n);a8=mod(i*12289_int64+211_int64,n);a9=mod(i*24593_int64+257_int64,n);a10=mod(i*49157_int64+313_int64,n);z=x(i);p=x(a1);q=x(a10)
          sum=sum+1.25_real64*z-.125_real64*p+.0625_real64*x(a2)-.03125_real64*x(a3)+.015625_real64*x(a4)-.0078125_real64*x(a5)+.00390625_real64*x(a6)-.001953125_real64*x(a7)+.0009765625_real64*x(a8)-.00048828125_real64*x(a9)+.000244140625_real64*q+.0078125_real64*z*z*z+.00390625_real64*p*q
          end do
          print '(ES24.16E3)',sum
          end program
          EOF
          cat >/tmp/ff.f90 <<'EOF'
          program s
          use iso_fortran_env,only:int64,real64
          implicit none
          integer(int64)::n,i,a1,a2,a3,a4,a5,a6,a7,a8,a9,a10
          real(real64)::sum,z,p,q
          character(len=64)::arg
          call get_command_argument(1,arg);read(arg,*)n;sum=0._real64
          !$omp simd reduction(+:sum)
          do i=0,n-1
          a1=mod(i*97_int64+17_int64,n);a2=mod(i*193_int64+31_int64,n);a3=mod(i*389_int64+47_int64,n);a4=mod(i*769_int64+71_int64,n);a5=mod(i*1543_int64+101_int64,n);a6=mod(i*3079_int64+131_int64,n);a7=mod(i*6151_int64+167_int64,n);a8=mod(i*12289_int64+211_int64,n);a9=mod(i*24593_int64+257_int64,n);a10=mod(i*49157_int64+313_int64,n);z=xval(i);p=xval(a1);q=xval(a10)
          sum=sum+1.25_real64*z-.125_real64*p+.0625_real64*xval(a2)-.03125_real64*xval(a3)+.015625_real64*xval(a4)-.0078125_real64*xval(a5)+.00390625_real64*xval(a6)-.001953125_real64*xval(a7)+.0009765625_real64*xval(a8)-.00048828125_real64*xval(a9)+.000244140625_real64*q+.0078125_real64*z*z*z+.00390625_real64*p*q
          end do
          print '(ES24.16E3)',sum
          contains
          pure function xval(k) result(r)
          integer(int64),intent(in)::k
          real(real64)::r
          r=-.375_real64+real(mod(k*31_int64+5_int64,1024_int64),real64)/1024._real64
          end function
          end program
          EOF
          gcc -O3 -march=native -fopenmp-simd -fno-fast-math /tmp/ca.c -o /tmp/ca
          gcc -O3 -march=native -fopenmp-simd -fno-fast-math /tmp/cf.c -o /tmp/cf
          gfortran -O3 -march=native -fopenmp -fno-fast-math -ffree-line-length-none /tmp/fa.f90 -o /tmp/fa
          gfortran -O3 -march=native -fopenmp -fno-fast-math -ffree-line-length-none /tmp/ff.f90 -o /tmp/ff
          python3 - <<'PY'
          import subprocess,time,statistics
          bins=[('WH','/tmp/wh'),('C_array','/tmp/ca'),('F_array','/tmp/fa'),('C_formula','/tmp/cf'),('F_formula','/tmp/ff')]
          for n in (1000000,10000000):
            print('=== N=%d ==='%n)
            for k,e in bins:
              ts=[];out=''
              for r in range(6):
                t=time.perf_counter();p=subprocess.run([e,str(n)],stdout=subprocess.PIPE,text=True,check=True);d=time.perf_counter()-t
                if r:ts.append(d)
                out=p.stdout.strip()
              print(f'{k},median_ms={statistics.median(ts)*1000:.6f},min_ms={min(ts)*1000:.6f},out={out}')
          PY
          echo '=== RSS10M_KB ==='
          for p in wh ca fa cf ff;do printf "$p,";/usr/bin/time -f '%M' /tmp/$p 10000000 >/dev/null;done
  cleanup:
    needs: bench
    if: always() && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - shell: bash
        run: |
          git pull --ff-only origin main
          rm -f .github/workflows/sparse-structural-intel-probe-once.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add -A;git diff --cached --quiet||git commit -m 'Remove one-shot sparse structural Intel probe [skip ci]';git push origin HEAD:main
