name: cleanup-library-transfer-128
on:
  push:
    paths:
      - '.github/workflows/cleanup-library-transfer-128.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove transfer residue
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .library-transfer-128
          rm -f .github/workflows/cleanup-library-transfer-128.yml
          git config user.name 'Wheelchair Transfer Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .library-transfer-128 .github/workflows/cleanup-library-transfer-128.yml
          git commit -m 'Remove temporary Wheelchair 1.3.128 Library transfer'
          git push origin HEAD:main
