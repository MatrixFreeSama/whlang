name: paper-scalar-v3-1.3.127
on:
  push:
    branches: [main]
    paths: ['.github/workflows/paper-pilot.yml']
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record runner CPU identity
        run: lscpu
      - name: Run scalar v3 negative controls
        run: python3 experiments/paper_1_3_127/run_scalar_v3.py
      - name: Commit raw reproducibility record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/paper_1_3_127/scalar_v3_20261005
          git rm .github/workflows/paper-audit.yml .github/workflows/paper-pilot.yml
          git commit -m 'Record Wheelchair 1.3.127 scalar v3 paper results'
          git push origin HEAD:main
