name: Backfill releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-releases.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create releases from dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t zips < <(printf '%s\n' dist/Wheelchair-*.zip | sort -V)
          for zip in "${zips[@]}"; do
            base="$(basename "$zip" .zip)"
            version="${base#Wheelchair-}"
            tag="v${version}"
            checksum="${zip}.sha256"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "skip existing release $tag"
              continue
            fi

            commit="$(git log --diff-filter=A --format='%H' -- "$zip" | tail -n 1)"
            if [[ -z "$commit" ]]; then
              commit="$GITHUB_SHA"
            fi

            assets=("$zip")
            if [[ -f "$checksum" ]]; then
              assets+=("$checksum")
            fi

            gh release create "$tag" "${assets[@]}" \
              --target "$commit" \
              --title "Wheelchair ${version}" \
              --notes "Wheelchair ${version}. Release assets are mirrored from the repository dist directory."
          done
