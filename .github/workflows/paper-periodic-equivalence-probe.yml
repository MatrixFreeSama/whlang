name: paper-periodic-equivalence-probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-periodic-equivalence-probe.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/w"; mkdir -p "$t"; unzip -q dist/Wheelchair-1.3.127.zip -d "$t"
          r="$t/Wheelchair-1.3.127/devtrash/benchmarks/periodic_affine_aging_13124"
          echo '=== d23 ==='; cat "$r/d23.whex"
          echo '=== d40 ==='; cat "$r/d40.whex"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/paper-periodic-equivalence-probe.yml
          git commit -m 'Complete periodic control equivalence probe'
          git push origin HEAD:main
