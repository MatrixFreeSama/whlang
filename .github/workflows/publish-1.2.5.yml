name: Publish Wheelchair 1.2.5

on:
  push:
    branches: [build-1.2.5-multifield]
    paths:
      - '.github/workflows/publish-1.2.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 36f6154d919fae160920804e540f6c4175923bb1
          path: release-source
          fetch-depth: 1
      - name: Rebuild and verify sealed release archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage
          mkdir -p stage/Wheelchair-1.2.5
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('release-source/worktree')
          dst=Path('stage/Wheelchair-1.2.5')
          skip_parts={'build','__pycache__','.pytest_cache'}
          skip_suffix={'.o','.pyc','.pyo'}
          for p in sorted(src.rglob('*')):
              rel=p.relative_to(src)
              if any(part in skip_parts for part in rel.parts): continue
              if p.is_dir():
                  (dst/rel).mkdir(parents=True,exist_ok=True); continue
              if p.suffix in skip_suffix: continue
              q=dst/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(p,q)
          bsrc=Path('release-source/benchmarks/fluid_solid_coupling_124')
          bdst=dst/'benchmarks'/'fluid_solid_coupling_124'; bdst.mkdir(parents=True,exist_ok=True)
          for name in ('fsi_coupled.wh','fsi_coupled.whex','fsi_decoupled.whex','Fluid_Solid_expert_C_matched.c'):
              shutil.copyfile(bsrc/name,bdst/name)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          stage=Path('stage'); root=stage/'Wheelchair-1.2.5'; out=Path('Wheelchair-1.2.5.zip')
          epoch=(2026,9,5,0,0,0)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  info=zipfile.ZipInfo(p.relative_to(stage).as_posix(),epoch)
                  info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          b=out.read_bytes(); h=hashlib.sha256(b).hexdigest()
          assert len(b)==406075,len(b)
          assert h=='775a6eed0e60aa2cca66a75a37e27422aab4851713f089c9e261af2686d91d4d',h
          with zipfile.ZipFile(out) as z:
              names=z.namelist()
              assert sorted({n.split('/',1)[0] for n in names if n})==['Wheelchair-1.2.5']
              assert z.read('Wheelchair-1.2.5/README.md').startswith(b'# Wheelchair 1.2.5\n')
              assert z.read('Wheelchair-1.2.5/VERSION').strip()==b'1.2.5'
              assert b'WHEELCHAIR_1_2_5_COMPLETE=PASS' in z.read('Wheelchair-1.2.5/RELEASE_GATES_1_2_5.txt')
          Path('Wheelchair-1.2.5.zip.sha256').write_text(h+'  Wheelchair-1.2.5.zip\n')
          print('FORMAL_ZIP_SIZE='+str(len(b)))
          print('FORMAL_ZIP_SHA256='+h)
          print('FORMAL_ZIP_REPRODUCIBLE=PASS')
          PY
      - name: Prepare compact public main tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/dist publish/benchmarks/shared_dependency_episode_125
          cp Wheelchair-1.2.5.zip publish/dist/Wheelchair-1.2.5.zip
          cp Wheelchair-1.2.5.zip.sha256 publish/dist/Wheelchair-1.2.5.zip.sha256
          cp release-source/benchmarks/fluid_solid_coupling_124/fsi_coupled.wh publish/benchmarks/shared_dependency_episode_125/fsi_coupled.wh
          cp release-source/benchmarks/fluid_solid_coupling_124/fsi_coupled.whex publish/benchmarks/shared_dependency_episode_125/fsi_coupled.whex
          cp release-source/benchmarks/fluid_solid_coupling_124/fsi_decoupled.whex publish/benchmarks/shared_dependency_episode_125/fsi_decoupled.whex
          cp release-source/benchmarks/fluid_solid_coupling_124/Fluid_Solid_expert_C_matched.c publish/benchmarks/shared_dependency_episode_125/Fluid_Solid_expert_C_matched.c
          cp release-source/worktree/README.md publish/README.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('publish/README.md'); s=p.read_text()
          marker='Wheelchair is an ahead-of-time, native, structure-first programming language project for general programming with HPC and simulation as primary design targets.\n'
          block='''\n## Official release archive\n\n```text\ndist/Wheelchair-1.2.5.zip\n```\n\nSHA-256:\n\n```text\n775a6eed0e60aa2cca66a75a37e27422aab4851713f089c9e261af2686d91d4d\n```\n\nHistorical release archives remain in `dist/`.\n'''
          assert marker in s
          s=s.replace(marker,marker+block,1)
          p.write_text(s)
          PY
          cat > publish/benchmarks/shared_dependency_episode_125/README.md <<'EOF'
          # Shared Dependency Episode 1.2.5 benchmark

          This directory contains the public structural witnesses and authority summary for Wheelchair 1.2.5 Shared Dependency Episode Physicalization.

          The benchmark uses a fluid/solid-style two-field operator, but the compiler optimization is not selected by physics or workload names. Admission is based on canonical structural pressure and dependency topology.

          Release selector witnesses:

          ```text
          Newton/Jv             5 -> legacy_1_2_4
          global stiffness      6 -> legacy_1_2_4
          decoupled two-field  11 -> shared_dependency_episode_wide_125
          coupled two-field    12 -> shared_dependency_episode_wide_125
          ```

          Formal authority run `33902157205` used two AVX-512-qualified AMD EPYC 9V74 hosts, with zero qualified failures. Each host measured exact Wheelchair 1.2.4, Wheelchair 1.2.5, and matched Expert C AVX-512 for 10M/100M, executors 1/2/4, decoupled/coupled, with 3 warmups and 11 shuffled/interleaved measured runs.

          | Host | Median 1.2.4 -> 1.2.5 | Geomean 1.2.4 -> 1.2.5 | Geomean 1.2.5 / Expert C |
          |---|---:|---:|---:|
          | slot 2 | 2.4486x | 2.4478x | 1.3443x |
          | slot 3 | 2.4508x | 2.4480x | 1.3445x |

          The predeclared release threshold was 1.50x for both median and geometric mean. All tested 1.2.4/1.2.5 two-field checksums were bit-identical. Expert C remained faster in aggregate on these AMD hosts, so the release claim is a large general multi-field recovery, not a general C-performance victory.

          Coupled witness machine shape: hot instructions 491 -> 297, `VDIVPD` 26 -> 0, reachable generated hot `CALL` edges = 0.

          Full proof material is frozen inside `dist/Wheelchair-1.2.5.zip`.
          EOF
          sed -i 's/^          //' publish/benchmarks/shared_dependency_episode_125/README.md
          cat > publish/benchmarks/shared_dependency_episode_125/authority_results_1_2_5.csv <<'EOF'
          host,mode,n,executors,wheelchair_1_2_4_ms,wheelchair_1_2_5_ms,expert_c512_ms,speedup_124_to_125,wheelchair_125_over_c
          slot2,decoupled,10000000,1,34.810862,15.414326,12.398190,2.2583,1.2433
          slot2,decoupled,10000000,2,35.800105,15.339343,11.725685,2.3339,1.3082
          slot2,decoupled,10000000,4,18.463173,8.201470,6.532850,2.2512,1.2554
          slot2,decoupled,100000000,1,338.440782,144.524788,113.268219,2.3417,1.2760
          slot2,decoupled,100000000,2,349.490063,144.132774,105.226103,2.4248,1.3697
          slot2,decoupled,100000000,4,175.981979,72.795836,53.390238,2.4175,1.3635
          slot2,coupled,10000000,1,46.196663,18.600267,13.742113,2.4837,1.3535
          slot2,coupled,10000000,2,47.390671,18.441267,13.416711,2.5698,1.3745
          slot2,coupled,10000000,4,24.290150,9.824352,7.406382,2.4724,1.3265
          slot2,coupled,100000000,1,450.840639,175.174715,124.123750,2.5737,1.4113
          slot2,coupled,100000000,2,464.787153,175.534481,122.179407,2.6478,1.4367
          slot2,coupled,100000000,4,234.013231,88.577818,61.938219,2.6419,1.4301
          slot3,decoupled,10000000,1,34.921144,15.436531,12.570903,2.2622,1.2280
          slot3,decoupled,10000000,2,35.829324,15.289544,11.723814,2.3434,1.3041
          slot3,decoupled,10000000,4,18.476565,8.241477,6.499708,2.2419,1.2680
          slot3,decoupled,100000000,1,338.643806,144.651695,113.238317,2.3411,1.2774
          slot3,decoupled,100000000,2,349.008467,144.148799,105.275605,2.4212,1.3693
          slot3,decoupled,100000000,4,176.089655,72.931604,53.504536,2.4144,1.3631
          slot3,coupled,10000000,1,46.202988,18.612340,13.683646,2.4824,1.3602
          slot3,coupled,10000000,2,47.435693,18.476555,13.418544,2.5673,1.3769
          slot3,coupled,10000000,4,24.341286,9.813436,7.397012,2.4804,1.3267
          slot3,coupled,100000000,1,451.216777,175.346106,124.166780,2.5733,1.4122
          slot3,coupled,100000000,2,464.820079,175.531742,122.153463,2.6481,1.4370
          slot3,coupled,100000000,4,234.314243,88.619876,61.998120,2.6440,1.4294
          EOF
          sed -i 's/^          //' publish/benchmarks/shared_dependency_episode_125/authority_results_1_2_5.csv
          if ! grep -q 'shared_dependency_episode_125' publish/benchmarks/README.md; then
            cat >> publish/benchmarks/README.md <<'EOF'

          ## Shared Dependency Episode 1.2.5

          `shared_dependency_episode_125/`

          The formal decoupled/coupled two-field witness for the general 1.2.5 Shared Dependency Episode recovery. It includes WH/WHEX sources, the matched Expert C control, and the two-host authority table.
          EOF
            sed -i 's/^          //' publish/benchmarks/README.md
          fi
          if [ -e publish/.github ]; then
            echo 'unexpected workflow/config directory on compact main' >&2; exit 1
          fi
      - name: Commit formal release to main
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          sha256sum dist/Wheelchair-1.2.5.zip
          [ "$(stat -c '%s' dist/Wheelchair-1.2.5.zip)" = 406075 ]
          grep -q '775a6eed0e60aa2cca66a75a37e27422aab4851713f089c9e261af2686d91d4d' dist/Wheelchair-1.2.5.zip.sha256
          grep -q '^# Wheelchair 1.2.5$' README.md
          git config user.name Kestis
          git config user.email des3505@outlook.com
          git add README.md dist/Wheelchair-1.2.5.zip dist/Wheelchair-1.2.5.zip.sha256 benchmarks/README.md benchmarks/shared_dependency_episode_125
          git diff --cached --check
          git commit -m 'Release Wheelchair 1.2.5'
          git push origin HEAD:main
          echo 'WHEELCHAIR_1_2_5_MAIN_PUBLICATION=PASS'
