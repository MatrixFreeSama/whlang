name: FSI AVX2 Duel 1.2.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bench-fsi-avx2-127.yml']

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        slot: [1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and qualify AVX2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench127
          {
            echo 'SLOT=${{ matrix.slot }}'
            lscpu | grep -E 'Vendor ID|Model name|CPU family|^Model:|Socket|Thread|Core' || true
          } | tee /tmp/bench127/host.txt
          cd worktree
          ./build.sh >/tmp/bench127/build.txt 2>&1
          ./build/topologyc --probe | tee /tmp/bench127/probe.txt
          grep -q 'AVX2: available' /tmp/bench127/probe.txt
      - name: Compile Wheelchair native256 and expert C AVX2
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for q in 1 2 4; do
            python3 whexc.py ../benchmarks/fluid_solid_coupling_124/fsi_coupled.whex -o "build/fsi_cpl_wh_avx2_q${q}" --executors "$q" --isa-limit avx2 --semantic-plan "/tmp/bench127/plan_q${q}.json" > "/tmp/bench127/driver_q${q}.json"
            python3 - "$q" <<'PY'
import json,sys
q=sys.argv[1]
p=json.load(open(f'/tmp/bench127/plan_q{q}.json'))
b=p['native_physical_backend']
assert b['physical_shape']=='native256', b
assert b['compiler_image'].endswith('native256'), b
assert b['runtime_selector']==0 and b['runtime_profitability_selector']==0 and b['scalar_fallback']==0, b
print(f'Q{q}_NATIVE256=PASS')
PY
          done
          COMMON='-O3 -flto -ffast-math -mprefer-vector-width=256 -mavx2 -mfma -mbmi -mbmi2 -mpopcnt -mno-avx512f -mno-avx512dq -mno-avx512vl -pthread'
          gcc $COMMON -DCOUPLED_MODE=1 ../benchmarks/fluid_solid_coupling_124/Fluid_Solid_expert_C_matched.c -o build/fsi_cpl_c_avx2
          objdump -d build/fsi_cpl_c_avx2 > /tmp/bench127/c.dis
          ! grep -Eq '%zmm[0-9]+|%k[1-7]([^0-9]|$)' /tmp/bench127/c.dis
          grep -Eq '%ymm[0-9]+' /tmp/bench127/c.dis
          echo 'EXPERT_C_AVX2_ONLY=PASS'
      - name: Benchmark coupled FSI AVX2
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 - <<'PY' | tee /tmp/bench127/result.txt
import os,random,statistics,subprocess,time,struct,re,math
from pathlib import Path
B=Path('build'); RUNS=11; WARM=3
rng=random.Random(0xF51A127)
def cpus(q): return ','.join(map(str,sorted(os.sched_getaffinity(0))[:q]))
def run(cmd): return subprocess.check_output(cmd,text=True).strip()
def val(s):
    m=re.search(r'0x([0-9a-fA-F]+)',s); b=int(m.group(1),16)
    return struct.unpack('>d',b.to_bytes(8,'big'))[0]
ratios=[]
for n in (10_000_000,100_000_000):
  for q in (1,2,4):
    cmds={'WH':['taskset','-c',cpus(q),str(B/f'fsi_cpl_wh_avx2_q{q}'),str(n)],'C':['taskset','-c',cpus(q),str(B/'fsi_cpl_c_avx2'),str(n),str(q)]}
    first={k:run(v) for k,v in cmds.items()}
    wv,cv=val(first['WH']),val(first['C']); rel=abs(wv-cv)/max(abs(cv),1.0)
    if rel>1e-8: raise SystemExit(f'numeric mismatch N={n} Q={q} rel={rel}')
    for cmd in cmds.values():
      for _ in range(WARM): run(cmd)
    samples={k:[] for k in cmds}
    for _ in range(RUNS):
      order=list(cmds); rng.shuffle(order)
      for k in order:
        t=time.perf_counter_ns(); run(cmds[k]); samples[k].append((time.perf_counter_ns()-t)/1e6)
    wm=statistics.median(samples['WH']); cm=statistics.median(samples['C']); r=wm/cm; ratios.append(r)
    print(f'FSI_AVX2 N={n} Q={q} WH_MS={wm:.6f} C_MS={cm:.6f} WH_C={r:.6f} SPEEDUP_C_OVER_WH={1/r:.6f} REL={rel:.3e}')
geo=math.exp(sum(math.log(x) for x in ratios)/len(ratios))
print(f'GEOMEAN_WH_OVER_C={geo:.9f}')
print(f'GEOMEAN_WHEELCHAIR_SPEEDUP={1/geo:.9f}')
print(f'WHEELCHAIR_WINS={sum(r<1 for r in ratios)}/{len(ratios)}')
print('FSI_AVX2_NUMERIC=PASS')
PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fsi-avx2-127-${{ matrix.slot }}
          path: /tmp/bench127
          if-no-files-found: warn
