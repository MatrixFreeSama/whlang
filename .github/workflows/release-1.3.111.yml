name: Wheelchair 1.3.111 one-shot release

on:
  push:
    paths:
      - '.github/workflows/release-1.3.111.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish Wheelchair 1.3.111
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-1.3.111.sh
