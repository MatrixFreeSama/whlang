name: sparse strict benchmark once
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/sparse-strict-benchmark-once.yml']
permissions:
  contents: write
jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CPU ==='; lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | head -n 7
          gcc --version | head -n1; gfortran --version | head -n1
          cd Wheelchair-1.2.14
          chmod +x bin/whexc bin/topologyc* || true
          ./bin/whexc benchmarks/caretaker_1214/irregular_sparse.whex -o /tmp/wh_sparse --executors 1
          cat >/tmp/sparse.c <<'EOF'
          #define _POSIX_C_SOURCE 200809L
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          int main(int argc,char**argv){
            uint64_t n=strtoull(argv[1],0,10); double *x=0; if(posix_memalign((void**)&x,64,n*sizeof(double))) return 3;
            #pragma omp simd
            for(uint64_t i=0;i<n;i++) x[i]=-0.375+(double)((i*31u+5u)%1024u)/1024.0;
            double s=0.0;
            #pragma omp simd reduction(+:s)
            for(uint64_t i=0;i<n;i++){
              uint64_t j1=(i*97u+17u)%n,j2=(i*193u+31u)%n,j3=(i*389u+47u)%n,j4=(i*769u+71u)%n,j5=(i*1543u+101u)%n,j6=(i*3079u+131u)%n,j7=(i*6151u+167u)%n,j8=(i*12289u+211u)%n,j9=(i*24593u+257u)%n,j10=(i*49157u+313u)%n;
              double xi=x[i],a=x[j1],b=x[j10];
              s += 1.25*xi - 0.125*a + 0.0625*x[j2] - 0.03125*x[j3] + 0.015625*x[j4] - 0.0078125*x[j5] + 0.00390625*x[j6] - 0.001953125*x[j7] + 0.0009765625*x[j8] - 0.00048828125*x[j9] + 0.000244140625*b + 0.0078125*xi*xi*xi + 0.00390625*a*b;
            }
            printf("%.17g\n",s); free(x); return 0;
          }
          EOF
          cat >/tmp/sparse.f90 <<'EOF'
          program sparse
            use iso_fortran_env, only: int64, real64
            implicit none
            integer(int64) :: n,i,j1,j2,j3,j4,j5,j6,j7,j8,j9,j10
            real(real64), allocatable :: x(:)
            real(real64) :: s,xi,a,b
            character(len=64) :: arg
            call get_command_argument(1,arg); read(arg,*) n
            allocate(x(0:n-1))
            !$omp simd
            do i=0,n-1
              x(i)=-0.375_real64+real(mod(i*31_int64+5_int64,1024_int64),real64)/1024.0_real64
            end do
            s=0.0_real64
            !$omp simd reduction(+:s)
            do i=0,n-1
              j1=mod(i*97_int64+17_int64,n); j2=mod(i*193_int64+31_int64,n); j3=mod(i*389_int64+47_int64,n); j4=mod(i*769_int64+71_int64,n)
              j5=mod(i*1543_int64+101_int64,n); j6=mod(i*3079_int64+131_int64,n); j7=mod(i*6151_int64+167_int64,n); j8=mod(i*12289_int64+211_int64,n)
              j9=mod(i*24593_int64+257_int64,n); j10=mod(i*49157_int64+313_int64,n)
              xi=x(i); a=x(j1); b=x(j10)
              s=s + 1.25_real64*xi - 0.125_real64*a + 0.0625_real64*x(j2) - 0.03125_real64*x(j3) + 0.015625_real64*x(j4) - 0.0078125_real64*x(j5) + 0.00390625_real64*x(j6) - 0.001953125_real64*x(j7) + 0.0009765625_real64*x(j8) - 0.00048828125_real64*x(j9) + 0.000244140625_real64*b + 0.0078125_real64*xi*xi*xi + 0.00390625_real64*a*b
            end do
            print '(ES24.16E3)',s
          end program
          EOF
          gcc -O3 -march=native -fopenmp-simd -fno-fast-math /tmp/sparse.c -o /tmp/c_strict
          gfortran -O3 -march=native -fopenmp -fno-fast-math -ffree-line-length-none /tmp/sparse.f90 -o /tmp/f_strict
          gcc -O3 -march=native -fopenmp-simd -ffast-math /tmp/sparse.c -o /tmp/c_fast
          gfortran -Ofast -march=native -fopenmp -ffree-line-length-none /tmp/sparse.f90 -o /tmp/f_fast
          python3 - <<'PY'
          import subprocess,time,statistics
          bins=[('Wheelchair','/tmp/wh_sparse'),('C_strict','/tmp/c_strict'),('Fortran_strict','/tmp/f_strict'),('C_fast','/tmp/c_fast'),('Fortran_fast','/tmp/f_fast')]
          for n in (1000000,10000000):
              print(f'=== N={n} ===')
              for label,exe in bins:
                  ts=[]; out=''
                  for r in range(6):
                      t=time.perf_counter(); p=subprocess.run([exe,str(n)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,check=True); dt=time.perf_counter()-t
                      if r: ts.append(dt)
                      out=p.stdout.strip()
                  print(f'{label},median_ms={statistics.median(ts)*1000:.6f},min_ms={min(ts)*1000:.6f},out={out}')
          PY
      - name: Self clean
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/sparse-strict-benchmark-once.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git diff --cached --quiet || git commit -m 'Remove one-shot sparse strict benchmark [skip ci]'; git push origin HEAD:main
