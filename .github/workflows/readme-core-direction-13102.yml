name: README core direction 1.3.102

on:
  push:

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()

          replacements = {
              '> Current release: **1.3.98**  ': '> Current release: **1.3.102**  ',
              '> [Download Wheelchair 1.3.98](./dist/Wheelchair-1.3.98.zip)': '> [Download Wheelchair 1.3.102](./dist/Wheelchair-1.3.102.zip)',
              '9943448a486c4dd52733ea7a18a7149fd28259005d05d79c0448a40e44b72cd0': 'e569f0b4c988467658402561f4b993325d9727dc4e59e61322d247591b079bf1',
              'unzip Wheelchair-1.3.98.zip\ncd Wheelchair-1.3.98': 'unzip Wheelchair-1.3.102.zip\ncd Wheelchair-1.3.102',
              '[current archive](./dist/Wheelchair-1.3.97.zip)': '[current archive](./dist/Wheelchair-1.3.102.zip)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing README replacement anchor: {old!r}')
              s = s.replace(old, new, 1)

          anchor = '''The project deliberately accepts local performance imperfections when the alternative would be an algorithm zoo or a growing tree of benchmark-specific branches.\n\n---\n\n## WH and WHEX'''
          if anchor not in s:
              raise SystemExit('missing design-principles insertion anchor')

          section = '''The project deliberately accepts local performance imperfections when the alternative would be an algorithm zoo or a growing tree of benchmark-specific branches.\n\n---\n\n## Primary target: physical-work inflation\n\nWheelchair is primarily aimed at the gap between **necessary work** and **actual physical work**. Dense, regular kernels can already be close to their necessary arithmetic and memory work, leaving relatively little removable overhead. The more characteristic Wheelchair target is the opposite regime: useful arithmetic is thin, while indexing, reconstruction, transport, synchronization, rematerialization, or execution-context work makes the machine perform substantially more work than the mathematical relation itself requires.\n\nThe optimization objective is therefore not maximum hardware occupancy. It is to push actual realization toward the necessary relation:\n\n```text\nnecessary mathematical / causal work\n            ↓\n     semantic and physical facts\n            ↓\n remove avoidable physical work\n            ↓\nactual machine work → necessary work\n```\n\nA processor can be highly occupied while spending much of that occupancy on work that does not advance the necessary result. Conversely, lower occupancy can be desirable when the same result is reached earlier with less total CPU time.\n\n### Representative benchmark: high-entropy, low-arithmetic-density reduction\n\nWheelchair 1.3.102 was tested against native GCC C and GFortran on **High-Entropy Sparse Permutation Reduction**. Each logical element performs only a small amount of useful floating-point arithmetic but evaluates six unrelated long-distance affine permutations modulo runtime `n`. The formal run uses `n = 50,000,000` to stabilize timing; the arithmetic density per logical element remains deliberately low.\n\nThe controls are normal compiler-generated native implementations, not hand-written assembly or AVX intrinsics: GCC/GFortran use `-O3 -march=native -fopenmp`; Strict additionally uses `-fno-fast-math -ffp-contract=off`, while the aggressive controls use `-ffast-math`. Runs are pinned to CPUs 0-3 with `OMP_WAIT_POLICY=PASSIVE`. Seven interleaved measured rounds produced identical checksum bits across all six implementations.\n\nThe host exposed five logical CPUs, while the benchmark was restricted to four. `Task-Manager equivalent` therefore uses the whole-machine convention where five visible logical CPUs are 100%; the benchmark's display ceiling is 80%.\n\n| Contract / implementation | Wall time | Process-tree CPU time | 4-core slot occupancy | Task-Manager equivalent |\n|---|---:|---:|---:|---:|\n| **Wheelchair Strict** | **53.160 ms** | **120 ms** | 57.9% | **46.3%** |\n| GCC C Strict | 192.998 ms | 700 ms | 90.7% | 72.5% |\n| GFortran Strict | 205.297 ms | 720 ms | 84.0% | 67.2% |\n| **Wheelchair Tolerance** | **30.674 ms** | **80 ms** | 65.2% | **52.2%** |\n| GCC C Fast | 208.127 ms | 730 ms | 87.7% | 70.1% |\n| GFortran Fast | 195.657 ms | 680 ms | 86.9% | 69.5% |\n\nIn Strict mode on this host, Wheelchair finishes **3.63× faster than the GCC C control** and **3.86× faster than the GFortran control**, while the C and Fortran controls consume **5.83×** and **6.00×** as much process CPU time respectively. Wheelchair's measured CPU occupancy is lower, so this is not a hardware-saturation win.\n\nThis benchmark is a representative witness of **physical-work inflation**, not an absolute proof of a universal theoretical lower bound and not a universal language ranking. The narrower claim is that, for this matched high-entropy/runtime-modulo workload, the conventional native controls consume substantially more physical CPU work for the same result.\n\n[Benchmark sources, controls, raw rounds, and summary](./benchmarks/high_entropy_sparse_permutation_13102/)\n\n---\n\n## WH and WHEX'''
          s = s.replace(anchor, section, 1)

          history_row = '| **1.3.97** | mass3 / chem6 / rigid7 Strict, 20M | geometric mean Wheelchair = **1.055× C time**; chem6 124.106 ms vs C 117.507 ms vs Fortran 118.969 ms | Wide scalar carrier use and proved whole-generation authority brought the deep-causal General set back close to mature native scalar controls without a workload-specific backend. |'
          if history_row not in s:
              raise SystemExit('missing benchmark-history anchor')
          new_history = history_row + '\n| **1.3.102** | High-Entropy Sparse Permutation Reduction, 50M | Strict: Wheelchair 53.160 ms / 120 ms CPU vs C 192.998 ms / 700 ms CPU vs Fortran 205.297 ms / 720 ms CPU | Representative low-arithmetic/high-entropy case: lower occupancy but substantially less physical CPU work for the same checksum. |'
          s = s.replace(history_row, new_history, 1)

          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/readme-core-direction-13102.yml
          git add README.md
          git commit -m "Document physical-work inflation as a core direction"
          git push
