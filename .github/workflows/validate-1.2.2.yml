name: Validate Wheelchair 1.2.2 Rank-N
on:
  push:
    branches: [build-1.2.2]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic 1.2.2 source upgrade
        run: |
          cd worktree
          python3 tools/apply_122.py
      - name: Build protected dual native lanes
        run: |
          cd worktree
          sh build.sh
      - name: Run Rank-N and technical-peak gates
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          sh test_rank_n_122.sh | tee /tmp/rankn122.log
      - name: Commit validated source transformation
        run: |
          git config user.name 'wheelchair-release-bot'
          git config user.email 'wheelchair-release-bot@users.noreply.github.com'
          git add worktree/surface/whex_surface.py worktree/surface/wh_structural.py worktree/wheelchairc.py worktree/build.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wheelchair 1.2.2: native Rank-N product realization with peak isolation'
          git push origin HEAD:build-1.2.2
