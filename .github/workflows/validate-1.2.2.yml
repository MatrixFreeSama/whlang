name: Validate Wheelchair 1.2.2 Rank-N
on:
  push:
    branches: [build-1.2.2]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic 1.2.2 source upgrade
        run: |
          cd worktree
          python3 tools/apply_122.py
      - name: Build protected native lanes
        run: |
          cd worktree
          sh build.sh
      - name: Report physical ISA
        run: |
          cd worktree
          ./build/topologyc --probe
          ./build/topologyc --isa-capabilities
      - name: Run monolithic 1.2.2 release harness
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          sh test_complete_122.sh | tee /tmp/wheelchair-1.2.2-release-gates.txt
