name: library-transfer-1.3.128
on:
  push:
    paths:
      - '.github/workflows/library-transfer-1.3.128.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize text transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum dist/Wheelchair-1.3.128.zip | awk '{print $1}')" = "9110b357e9e5eafcd07df8751e803a7fb4f209b4332fc2b7f4e6a02e0b9ac761"
          rm -rf .library-transfer-128
          mkdir .library-transfer-128
          base64 -w0 dist/Wheelchair-1.3.128.zip | split -b 600000 - .library-transfer-128/part_
          printf '%s\n' '9110b357e9e5eafcd07df8751e803a7fb4f209b4332fc2b7f4e6a02e0b9ac761  Wheelchair-1.3.128.zip' > .library-transfer-128/Wheelchair-1.3.128.zip.sha256
          rm -f .github/workflows/library-transfer-1.3.128.yml
          git config user.name 'Wheelchair Transfer Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .library-transfer-128 .github/workflows/library-transfer-1.3.128.yml
          git commit -m 'Materialize temporary Wheelchair 1.3.128 Library transfer'
          git push origin HEAD:main
