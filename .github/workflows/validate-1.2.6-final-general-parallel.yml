name: Validate Wheelchair 1.2.6 Final General Parallel

on:
  push:
    branches:
      - build-1.2.6-final-general-parallel
  workflow_dispatch:

jobs:
  final-general-parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout final 1.2.6
        uses: actions/checkout@v4

      - name: Checkout clean 1.2.5 byte authority
        uses: actions/checkout@v4
        with:
          ref: build-1.2.5-multifield
          path: baseline125

      - name: Build final 1.2.6 compiler/runtime
        working-directory: worktree
        run: |
          set -euxo pipefail
          ./build.sh 2>&1 | tee build_final_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_DERIVED_GENERATION=PASS' build_final_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_BASE=BUILT' build_final_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_WIDE=BUILT' build_final_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_DERIVED=BUILT' build_final_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_WORKLOAD_DISPATCH=0' build_final_126.log
          grep -Fq 'GENERAL_PARALLEL_SLOT_ENGINE=BUILT' build_final_126.log
          grep -Fq 'GENERAL_PARALLEL_SLOT_FOREIGN_RUNTIME_BACKEND=0' build_final_126.log
          grep -Fq 'GENERAL_PARALLEL_FABRIC_AUTHORITY=topology-parallel' build_final_126.log
          grep -Fq 'ACTIVE_SPECIAL_PURPOSE_NATIVE_ROUTE=0' build_final_126.log
          grep -Fq 'WHEELCHAIR_BUILD=PASS' build_final_126.log

      - name: Build clean 1.2.5 byte authority
        run: |
          set -euxo pipefail
          (cd baseline125/worktree && ./build.sh > ../../baseline125_build.log 2>&1)
          test -x baseline125/worktree/build/topologyc
          test -x baseline125/worktree/build/topologyc-sdep
          test -x baseline125/worktree/build/topologyc-rankn

      - name: Self-prove 1.2.5 static authority and qualified dynamic witness
        run: |
          set -euxo pipefail
          cd baseline125/worktree
          echo 'e7b05d8c6f401b0d8b7caa6db4016ee39ca3100d6f781ff438375528f3dbd0d6  compiler/tensor_frontend_x86_64.S' | sha256sum -c -
          echo '2e83af25b6a6188c9ce24497d636206ca5978e59a92b619e6b722909ad2d4f80  compiler/topologyc_x86_64.S' | sha256sum -c -
          echo 'e9116041c673aec4dca58a43379ccb78d5ae3d6aa7e7ba76656da32b24cdfeb3  runtime/tensor_runtime_template_x86_64.S' | sha256sum -c -
          PYTHONPATH=surface python3 - <<'PY'
          from pathlib import Path
          import wh_structural, whex_surface
          wh_path=Path('../benchmarks/fluid_solid_coupling_124/fsi_coupled.wh')
          wx_path=Path('../benchmarks/fluid_solid_coupling_124/fsi_coupled.whex')
          wh_data, wh_parser = wh_structural.compile_surface(wh_path.read_text(encoding='utf-8'), wh_path)
          wx_data, _, _ = whex_surface.load_surface(wx_path)
          wh_core=wh_structural.canonical_core_bytes(wh_data)
          wx_core=whex_surface.canonical_core_bytes(wx_data)
          assert wh_core == wx_core
          Path('/tmp/self125_shared.core.wh').write_bytes(wh_core)
          print('BASELINE_1_2_5_WH_WHEX_CANONICAL_BYTE_EQUIVALENCE=PASS')
          PY
          echo 'BASELINE_1_2_5_STATIC_AUTHORITY_SELFTEST=PASS'
          if grep -qm1 -w avx512f /proc/cpuinfo; then
            echo 'BASELINE_1_2_5_HOST_AVX512_QUALIFIED=1'
            ./whexc ../benchmarks/fluid_solid_coupling_124/fsi_coupled.whex \
              -o build/self125_whex --executors 1 \
              --semantic-plan /tmp/self125_whex.plan.json > ../../baseline125_wrapper_selftest.log
            ./build/topologyc-sdep /tmp/self125_shared.core.wh \
              -o build/self125_wh > ../../baseline125_wh_wrapper_selftest.log
            cmp build/self125_whex build/self125_wh
            test "$(build/self125_whex 10000000)" = 'checksum_bits=0x4130e896f42e1dd6'
            sh ./test_shared_dependency_episode_125.sh > ../../baseline125_full_selftest.log 2>&1
            grep -Fq 'WHEELCHAIR_SHARED_DEPENDENCY_EPISODE_1_2_5=PASS' ../../baseline125_full_selftest.log
            echo 'BASELINE_1_2_5_DYNAMIC_AUTHORITY=PASS'
          else
            echo 'BASELINE_1_2_5_HOST_AVX512_QUALIFIED=0'
            echo 'BASELINE_1_2_5_DYNAMIC_AUTHORITY=SKIP_HOST_NOT_AVX512F' > ../../baseline125_full_selftest.log
            : > ../../baseline125_wrapper_selftest.log
            : > ../../baseline125_wh_wrapper_selftest.log
          fi

      - name: Prove general WH native Q1 Q2 Q4 materialization
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_general_parallel_native_126.sh 2>&1 | tee general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_Q1_Q2_Q4_EQUIVALENCE=PASS' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_ITERATE_RELOCATION=PASS' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_FRAGMENTATION=PASS' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_SOURCE_ORDER_SERIALIZATION=0' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_GLOBAL_READY_QUEUE=0' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_RUNTIME_SELECTOR=0' general_parallel_native_126.log
          grep -Fq 'GENERAL_PARALLEL_NATIVE_SERIAL_FALLBACK=0' general_parallel_native_126.log
          grep -Fq 'WHEELCHAIR_GENERAL_PARALLEL_NATIVE_1_2_6=PASS' general_parallel_native_126.log

      - name: Prove generic native resource profiles
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_native_resource_profiles_126.sh 2>&1 | tee native_resource_profiles_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_STRUCTURAL_ADMISSION=PASS' native_resource_profiles_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_WORKLOAD_DISPATCH=0' native_resource_profiles_126.log
          grep -Fq 'WIDE_PROFILE_1_2_5_LOADABLE_BYTE_IDENTITY=PASS' native_resource_profiles_126.log
          grep -Fq 'WH_WHEX_WIDE_CANONICAL_BYTE_EQUIVALENCE=PASS' native_resource_profiles_126.log
          grep -Fq 'WH_WHEX_NATIVE_RESOURCE_PROFILE_EQUIVALENCE=PASS' native_resource_profiles_126.log
          grep -Eq 'WIDE_PROFILE_SAME_CORE_NATIVE_BYTE_IDENTITY=(PASS|SKIP_HOST_NOT_AVX512F)' native_resource_profiles_126.log
          grep -Eq 'NATIVE_RESOURCE_PROFILE_WIDE_VDIVPD=(0|SKIP_HOST_NOT_AVX512F)' native_resource_profiles_126.log
          grep -Eq 'NATIVE_RESOURCE_PROFILE_WIDE_REACHABLE_CALLS=(0|SKIP_HOST_NOT_AVX512F)' native_resource_profiles_126.log
          grep -Fq 'NATIVE_RESOURCE_PROFILE_SPECIAL_PURPOSE_ROUTE=0' native_resource_profiles_126.log
          grep -Fq 'WHEELCHAIR_NATIVE_RESOURCE_PROFILES_1_2_6=PASS' native_resource_profiles_126.log

      - name: Preserve schedulerless and semantic gates
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_general_parallel_126.sh 2>&1 | tee general_parallel_semantic_126.log
          sh ./test_schedulerless_causal_126.sh 2>&1 | tee schedulerless_126.log
          grep -Fq 'WHEELCHAIR_GENERAL_PARALLEL_1_2_6=PASS' general_parallel_semantic_126.log
          grep -Fq 'WHEELCHAIR_SCHEDULERLESS_CAUSAL_1_2_6=PASS' schedulerless_126.log

      - name: Byte-protect mature 1.2.5 technical peaks
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_native_peak_preservation_126.sh 2>&1 | tee native_peak_preservation_126.log
          grep -Fq 'BASE_PROFILE_1_2_5_COMPILER_LOADABLE_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Fq 'WIDE_PROFILE_1_2_5_COMPILER_LOADABLE_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Fq 'DERIVED_PROFILE_1_2_5_FRONTEND_LOADABLE_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Fq 'DERIVED_PROFILE_1_2_5_COMPILER_TEXT_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Fq 'DERIVED_PROFILE_1_2_5_RUNTIME_LOADABLE_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Eq 'BASE_PROFILE_1_2_5_EMITTED_LOADABLE_BYTE_IDENTITY=(PASS|SKIP_HOST_NOT_AVX512F)' native_peak_preservation_126.log
          grep -Eq 'WIDE_PROFILE_1_2_5_EMITTED_LOADABLE_BYTE_IDENTITY=(PASS|SKIP_HOST_NOT_AVX512F)' native_peak_preservation_126.log
          grep -Eq 'DERIVED_PROFILE_1_2_5_EMITTED_LOADABLE_BYTE_IDENTITY=(PASS|SKIP_HOST_NOT_AVX512F)' native_peak_preservation_126.log
          grep -Fq 'MATURE_RUNTIME_1_2_5_NATIVE_BYTE_IDENTITY=PASS' native_peak_preservation_126.log
          grep -Fq 'WHEELCHAIR_1_2_5_TECHNICAL_PEAK_EXECUTION_BYTES_PRESERVED=PASS' native_peak_preservation_126.log

      - name: Static special-purpose and anti-serial audit
        run: |
          set -euxo pipefail
          test ! -e worktree/surface/shared_dependency_episode.py
          test ! -e worktree/tools/generate_shared_dependency_episode_125.py
          test ! -e worktree/test_shared_dependency_episode_125.sh
          test ! -e worktree/tools/generate_rankn_backend_122.py
          test -e worktree/tools/generate_derived_native_backend.py
          test ! -e .github/workflows/benchmark-schedulerless-causal-126.yml
          test ! -e .github/workflows/diagnose-1.2.6-baseline.yml
          test ! -e .github/workflows/validate-1.2.6-schedulerless-causal.yml
          ! grep -R -n -E 'shared_dependency_episode|topologyc-sdep|shared_dependency_episode_wide_125' \
            worktree/build.sh worktree/wheelchairc.py worktree/whexc.py \
            worktree/surface/native_resource_profile.py worktree/tools/generate_native_resource_profiles.py \
            worktree/tools/generate_derived_native_backend.py
          ! grep -R -n -E 'generate_rankn_backend_122|generated_122|runtime_rankn_offsets|tensor_rankn_(frontend|runtime_template)|runtime_rankn_blob' \
            worktree/build.sh worktree/tools/generate_derived_native_backend.py
          ! grep -n -E 'work_steal|global_ready_queue|runtime_cost_selector|serial_fallback' \
            worktree/runtime/general_parallel_slot_x86_64.S
          ! grep -n -E '\b(heat|newton|fsi|stiffness|fem|cfd|poisson|kkt|fluid|solid|navier|elastic|electromagnetic)\b|workload_name' \
            worktree/surface/native_resource_profile.py worktree/tools/generate_native_resource_profiles.py \
            worktree/tools/generate_derived_native_backend.py
          readelf -d worktree/build/general_parallel_slot.elf 2>&1 | grep -Fq 'There is no dynamic section'
          readelf -d worktree/build/topology-parallel 2>&1 | grep -Fq 'There is no dynamic section'
          echo 'ACTIVE_SPECIAL_PURPOSE_NATIVE_ROUTE=0'
          echo 'ACTIVE_LEGACY_DERIVED_FILE_ROUTE=0'
          echo 'ACTIVE_HIDDEN_SERIAL_SPINE=0'

      - name: Archive final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelchair-126-final-general-parallel-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            worktree/build_final_126.log
            worktree/general_parallel_native_126.log
            worktree/native_resource_profiles_126.log
            worktree/general_parallel_semantic_126.log
            worktree/schedulerless_126.log
            worktree/native_peak_preservation_126.log
            baseline125_build.log
            baseline125_wrapper_selftest.log
            baseline125_wh_wrapper_selftest.log
            baseline125_full_selftest.log
            worktree/build/general_parallel_126/*.json
            worktree/build/general_parallel_126/*.out
