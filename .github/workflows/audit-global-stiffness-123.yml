name: Audit Remaining Wheelchair Stiffness Hot-Loop Gap
# trigger: post-residency machine-code audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-global-stiffness-123.yml']
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1,2,3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - name: Build and qualify
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then echo 'qualified=true' >> "$GITHUB_OUTPUT"; else echo 'qualified=false' >> "$GITHUB_OUTPUT"; fi
      - name: Disassemble optimized Wheelchair and expert C
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o build/stiff_resident --executors 1 >/dev/null
          gcc -O3 -march=native -mtune=native -flto -ffast-math -pthread ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o build/stiff_c
          sh tools/disassemble_generated.sh build/stiff_resident > /tmp/wh.dis 2>&1
          objdump -d -M intel build/stiff_c > /tmp/c.dis
          printf '%-20s %6s %6s\n' TOKEN WH C | tee /tmp/counts.txt
          for p in vpmullq vpmulld vpaddq vpaddd vpandq vpandd vcvttpd2qq vcvtqq2pd vcvtdq2pd vpsllq vpsrlq vfnmadd vmulpd vaddpd vsubpd vextractf64x4 kmov call; do
            w=$(grep -Eic "$p" /tmp/wh.dis || true)
            c=$(grep -Eic "$p" /tmp/c.dis || true)
            printf '%-20s %6d %6d\n' "$p" "$w" "$c" | tee -a /tmp/counts.txt
          done
          echo '=== Wheelchair generated RX ==='
          cat /tmp/wh.dis
          echo '=== Expert C vector instruction excerpts ==='
          grep -Ein -C 10 'vpmull|vfnmadd|vmulpd|vaddpd|vcvt|vpand|vextract' /tmp/c.dis | head -800 || true
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: remaining-gap-audit-${{ matrix.image }}-${{ matrix.slot }}
          path: |
            /tmp/wh.dis
            /tmp/c.dis
            /tmp/counts.txt
            /tmp/probe.txt
          if-no-files-found: error
