name: Benchmark Wheelchair Generic Vector Reduction Residency
# trigger: four-way same-host validation v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-global-stiffness-123.yml']
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1,2,3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - name: Build experimental structural lanes
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          cp build/topologyc build/topologyc-resident
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then echo 'qualified=true' >> "$GITHUB_OUTPUT"; else echo 'qualified=false' >> "$GITHUB_OUTPUT"; fi
      - name: Compile frozen product-only resident and expert C contestants
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          as --64 compiler/tensor_frontend_x86_64.S -o build/tensor_frontend_baseline.o
          ld -nostdlib -static -z noexecstack build/topologyc_core.o build/tensor_frontend_baseline.o build/general_frontend.o build/runtime_blob.o build/general_runtime_blob.o -o build/topologyc-baseline
          as --64 build/tensor_frontend_product_subtract.S -o build/tensor_frontend_product.o
          ld -nostdlib -static -z noexecstack build/topologyc_core.o build/tensor_frontend_product.o build/general_frontend.o build/runtime_blob.o build/general_runtime_blob.o -o build/topologyc-product
          for q in 1 2 4; do
            cp build/topologyc-baseline build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/global_stiffness_base_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-product build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/global_stiffness_product_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-resident build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/global_stiffness_resident_q${q}" --executors "$q" >/dev/null
          done
          cp build/topologyc-resident build/topologyc
          gcc -O3 -march=native -mtune=native -flto -ffast-math -pthread ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o build/global_stiffness_c
          gcc --version | head -1 | tee /tmp/gcc.txt
      - name: Audit generated RX erasures
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for k in base product resident; do sh tools/disassemble_generated.sh "build/global_stiffness_${k}_q1" > "/tmp/${k}.dis" 2>&1; done
          count(){ grep -Eic "$2" "/tmp/$1.dis" || true; }
          {
            printf 'BASE_VFNMADD=%s\n' "$(count base vfnmadd)"
            printf 'PRODUCT_VFNMADD=%s\n' "$(count product vfnmadd)"
            printf 'RESIDENT_VFNMADD=%s\n' "$(count resident vfnmadd)"
            printf 'BASE_VMULPD=%s\n' "$(count base vmulpd)"
            printf 'PRODUCT_VMULPD=%s\n' "$(count product vmulpd)"
            printf 'RESIDENT_VMULPD=%s\n' "$(count resident vmulpd)"
            printf 'BASE_VSUBPD=%s\n' "$(count base vsubpd)"
            printf 'PRODUCT_VSUBPD=%s\n' "$(count product vsubpd)"
            printf 'RESIDENT_VSUBPD=%s\n' "$(count resident vsubpd)"
            printf 'PRODUCT_ZMM12_ACCUM=%s\n' "$(count product 'vaddpd.*%zmm0.*%zmm12|vaddpd.*zmm12.*zmm12.*zmm0')"
            printf 'RESIDENT_ZMM12_ACCUM=%s\n' "$(count resident 'vaddpd.*%zmm0.*%zmm12|vaddpd.*zmm12.*zmm12.*zmm0')"
            printf 'RESIDENT_GENERATED_CALLS=%s\n' "$(count resident call)"
          } | tee /tmp/audit.txt
          test "$(count base vfnmadd)" -eq 0
          test "$(count product vfnmadd)" -gt 0
          test "$(count resident vfnmadd)" -gt 0
          test "$(count resident call)" -eq 0
          test "$(count product 'vaddpd.*%zmm0.*%zmm12|vaddpd.*zmm12.*zmm12.*zmm0')" -eq 0
          test "$(count resident 'vaddpd.*%zmm0.*%zmm12|vaddpd.*zmm12.*zmm12.*zmm0')" -gt 0
      - name: Four-way 21-run same-host benchmark
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/global_stiffness_123/bench_fourway.py | tee /tmp/result.txt
      - name: Preserve Newton native peak bytes
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for q in 1 2 4; do
            cp build/topologyc-baseline build/topologyc
            ./whexc tests/whex/newton_jv_mature_regression.whex -o "build/newton_base_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-resident build/topologyc
            ./whexc tests/whex/newton_jv_mature_regression.whex -o "build/newton_resident_q${q}" --executors "$q" >/dev/null
            cmp "build/newton_base_q${q}" "build/newton_resident_q${q}"
          done
          cp build/topologyc-resident build/topologyc
          echo 'NEWTON_JV_NATIVE_BYTE_IDENTITY_AFTER_VECTOR_RESIDENCY=PASS'
      - name: Regress mature Rank-N and SCE
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          sh test_rank_n_122.sh | tee /tmp/rankn.txt
          grep -q '^WHEELCHAIR_RANK_N_1_2_2=PASS$' /tmp/rankn.txt
          sh test_sparse_causal_expansion_123.sh | tee /tmp/sce.txt
          grep -q '^WHEELCHAIR_SPARSE_CAUSAL_EXPANSION_1_2_3=PASS$' /tmp/sce.txt
          echo 'VECTOR_REDUCTION_RESIDENCY_OLD_TECHNICAL_PEAKS=PASS'
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: vector-reduction-residency-${{ matrix.image }}-${{ matrix.slot }}
          path: |
            /tmp/result.txt
            /tmp/audit.txt
            /tmp/probe.txt
            /tmp/gcc.txt
            /tmp/rankn.txt
            /tmp/sce.txt
          if-no-files-found: error
