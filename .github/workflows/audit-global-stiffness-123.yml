name: Audit Wheelchair 1.2.3 Global Stiffness Machine Code
# trigger: final audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-global-stiffness-123.yml']
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1,2,3]
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - shell: bash
        id: isa
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then echo 'qualified=true' >> "$GITHUB_OUTPUT"; else echo 'qualified=false' >> "$GITHUB_OUTPUT"; fi
      - shell: bash
        if: steps.isa.outputs.qualified == 'true'
        run: |
          set -euo pipefail
          cd worktree
          ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o build/stiff_wh --executors 1 >/dev/null
          gcc -O3 -march=native -mtune=native -flto -ffast-math -pthread ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o build/stiff_c
          gcc -O3 -march=native -mtune=native -ffast-math -pthread -S -masm=intel ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o /tmp/stiff_c.s
          echo '=== WH GENERATED RX ===' > /tmp/audit.txt
          sh tools/disassemble_generated.sh build/stiff_wh >> /tmp/audit.txt 2>&1 || true
          echo '=== C ASM ===' >> /tmp/audit.txt
          cat /tmp/stiff_c.s >> /tmp/audit.txt
          echo '=== COUNTS ===' >> /tmp/audit.txt
          for p in vpmullq vcvttpd2qq vpsrlq vpandq vpaddq vsubpd vaddpd vmulpd vfmadd vfmsub vbroadcast call; do
            printf '%s WH=' "$p" >> /tmp/audit.txt
            sh tools/disassemble_generated.sh build/stiff_wh 2>/dev/null | grep -Eic "$p" >> /tmp/audit.txt || true
            printf '%s C=' "$p" >> /tmp/audit.txt
            grep -Eic "$p" /tmp/stiff_c.s >> /tmp/audit.txt || true
          done
          cat /tmp/probe.txt >> /tmp/audit.txt
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: stiffness-audit-${{ matrix.image }}-${{ matrix.slot }}
          path: /tmp/audit.txt
          if-no-files-found: error
