name: Dissect Wheelchair vs Expert C512 Hot Kernel
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-global-stiffness-123.yml']
permissions:
  contents: read
jobs:
  dissect:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04]
        slot: [1,2,3,4]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - name: Build and qualify
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then echo 'qualified=true' >> "$GITHUB_OUTPUT"; else echo 'qualified=false' >> "$GITHUB_OUTPUT"; fi
      - name: Dissect resident and forced-512 C
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          as --64 build/tensor_frontend_product_subtract_residency.S -o build/tensor_frontend_resident.o
          ld -nostdlib -static -z noexecstack build/topologyc_core.o build/tensor_frontend_resident.o build/general_frontend.o build/runtime_blob.o build/general_runtime_blob.o -o build/topologyc-resident
          cp build/topologyc-resident build/topologyc
          ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o build/stiff_wh --executors 1 >/dev/null
          gcc -O3 -march=native -mtune=native -flto -ffast-math -mprefer-vector-width=512 -pthread ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o build/stiff_c512
          sh tools/disassemble_generated.sh build/stiff_wh > /tmp/wh.dis 2>&1
          objdump -d -M intel build/stiff_c512 > /tmp/c512.dis
          nm -n build/stiff_c512 | grep -E ' worker$|worker\.' | tee /tmp/symbols.txt || true
          printf '%-22s %6s %6s\n' TOKEN WH C512 | tee /tmp/counts.txt
          for p in vmovdqa64 vmovapd vpbroadcastq vpmullq vpaddq vpsubq vpandq vpminuq vcvtqq2pd vcvttpd2qq vfmadd vfnmadd vfmsub vmulpd vaddpd vsubpd vextract kmov call; do
            w=$(grep -Eic "$p" /tmp/wh.dis || true); c=$(grep -Eic "$p" /tmp/c512.dis || true)
            printf '%-22s %6d %6d\n' "$p" "$w" "$c" | tee -a /tmp/counts.txt
          done
          echo '=== WH RX ==='
          sed -n '1,260p' /tmp/wh.dis
          echo '=== C512 WORKER ZMM CORE ==='
          grep -Ein -C 35 'zmm2[1-4].*vfmadd|vfmadd.*zmm2[1-4]|zmm.*vfmsub|vfmsub.*zmm|zmm.*vmulpd|vmulpd.*zmm' /tmp/c512.dis | head -900 || true
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: c512-hot-kernel-${{ matrix.slot }}
          path: |
            /tmp/wh.dis
            /tmp/c512.dis
            /tmp/counts.txt
            /tmp/probe.txt
            /tmp/symbols.txt
          if-no-files-found: error
