name: Validate Wheelchair Full-Block Tail Gate Fusion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-global-stiffness-123.yml']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-24.04]
        slot: [1,2,3]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-global-stiffness-1.2.3
          fetch-depth: 0
      - name: Build and qualify
        id: isa
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          python3 tools/apply_123.py
          sh build.sh
          cp build/topologyc build/topologyc-tailgate
          ./build/topologyc --probe | tee /tmp/probe.txt
          if grep -q 'AVX-512F: usable' /tmp/probe.txt; then echo 'qualified=true' >> "$GITHUB_OUTPUT"; else echo 'qualified=false' >> "$GITHUB_OUTPUT"; fi
      - name: Build comparison lanes
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          as --64 compiler/tensor_frontend_x86_64.S -o build/tensor_frontend_baseline.o
          ld -nostdlib -static -z noexecstack build/topologyc_core.o build/tensor_frontend_baseline.o build/general_frontend.o build/runtime_blob.o build/general_runtime_blob.o -o build/topologyc-baseline
          as --64 build/tensor_frontend_product_subtract_residency.S -o build/tensor_frontend_resident.o
          ld -nostdlib -static -z noexecstack build/topologyc_core.o build/tensor_frontend_resident.o build/general_frontend.o build/runtime_blob.o build/general_runtime_blob.o -o build/topologyc-resident
          for q in 1 2 4; do
            cp build/topologyc-baseline build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/stiff_base_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-resident build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/stiff_resident_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-tailgate build/topologyc
            ./whexc ../benchmarks/global_stiffness_123/stiffness.whex -o "build/stiff_tailgate_q${q}" --executors "$q" >/dev/null
          done
          cp build/topologyc-tailgate build/topologyc
          gcc -O3 -march=native -mtune=native -flto -ffast-math -mprefer-vector-width=512 -pthread ../benchmarks/global_stiffness_123/Global_Stiffness_expert_C_matched.c -o build/stiff_c512
          gcc --version | head -1 | tee /tmp/gcc.txt
      - name: Audit hot-loop compare erasure
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          sh tools/disassemble_generated.sh build/stiff_resident_q1 > /tmp/resident.dis 2>&1
          sh tools/disassemble_generated.sh build/stiff_tailgate_q1 > /tmp/tailgate.dis 2>&1
          r=$(grep -Eic 'cmp.*r8.*0x8|cmp.*r8.*,8' /tmp/resident.dis || true)
          t=$(grep -Eic 'cmp.*r8.*0x8|cmp.*r8.*,8' /tmp/tailgate.dis || true)
          echo "RESIDENT_CMP_R8_8=$r" | tee /tmp/audit.txt
          echo "TAILGATE_CMP_R8_8=$t" | tee -a /tmp/audit.txt
          test "$t" -lt "$r"
          test "$(grep -Eic 'vaddpd.*zmm12.*zmm0|vaddpd.*%zmm0.*%zmm12' /tmp/tailgate.dis || true)" -gt 0
          test "$(grep -Eic '\bcall\b' /tmp/tailgate.dis || true)" -eq 0
          echo 'FULL_BLOCK_TAIL_GATE_MACHINE_ERASURE=PASS' | tee -a /tmp/audit.txt
      - name: Four-way same-host benchmark
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/result.txt
          import os,random,statistics,subprocess,time
          from pathlib import Path
          B=Path('worktree/build'); RUNS=21; WARM=3
          def cs(q): return ','.join(map(str,sorted(os.sched_getaffinity(0))[:q]))
          def run(c): return subprocess.check_output(c,text=True).strip()
          def wh(k,n,q): return ['taskset','-c',cs(q),str(B/f'stiff_{k}_q{q}'),str(n)]
          def cc(n,q): return ['taskset','-c',cs(q),str(B/'stiff_c512'),str(n),str(q)]
          rng=random.Random(0xF011B10C)
          for n in (10_000_000,100_000_000):
            for q in (1,2,4):
              cmds={'BASE':wh('base',n,q),'RESIDENT':wh('resident',n,q),'TAILGATE':wh('tailgate',n,q),'C512':cc(n,q)}
              out={k:run(v) for k,v in cmds.items()}
              if len(set(out.values())) != 1: raise SystemExit(f'checksum mismatch n={n} q={q} {out}')
              for c in cmds.values():
                for _ in range(WARM): run(c)
              s={k:[] for k in cmds}
              for _ in range(RUNS):
                order=list(cmds); rng.shuffle(order)
                for k in order:
                  t=time.perf_counter_ns(); run(cmds[k]); s[k].append((time.perf_counter_ns()-t)/1e6)
              m={k:statistics.median(v) for k,v in s.items()}
              print(f'TAILGATE N={n} Q={q} BASE={m["BASE"]:.6f} RES={m["RESIDENT"]:.6f} TAIL={m["TAILGATE"]:.6f} C512={m["C512"]:.6f} RES/TAIL={m["RESIDENT"]/m["TAILGATE"]:.4f}x C512/TAIL={m["C512"]/m["TAILGATE"]:.4f}x')
          print('TAIL_GATE_FOURWAY_REFERENCE=PASS')
          PY
      - name: Preserve Newton bytes and mature gates
        if: steps.isa.outputs.qualified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd worktree
          for q in 1 2 4; do
            cp build/topologyc-baseline build/topologyc
            ./whexc tests/whex/newton_jv_mature_regression.whex -o "build/newton_base_q${q}" --executors "$q" >/dev/null
            cp build/topologyc-tailgate build/topologyc
            ./whexc tests/whex/newton_jv_mature_regression.whex -o "build/newton_tail_q${q}" --executors "$q" >/dev/null
            cmp "build/newton_base_q${q}" "build/newton_tail_q${q}"
          done
          cp build/topologyc-tailgate build/topologyc
          echo 'NEWTON_JV_NATIVE_BYTE_IDENTITY_AFTER_TAIL_GATE=PASS'
          sh test_rank_n_122.sh | tee /tmp/rankn.txt
          grep -q '^WHEELCHAIR_RANK_N_1_2_2=PASS$' /tmp/rankn.txt
          sh test_sparse_causal_expansion_123.sh | tee /tmp/sce.txt
          grep -q '^WHEELCHAIR_SPARSE_CAUSAL_EXPANSION_1_2_3=PASS$' /tmp/sce.txt
          grep -q '^RANK_N_GENERATED_RX_CALL_EDGES=0$' /tmp/rankn.txt
          grep -q '^RANK_N_SCALAR_FALLBACK=0$' /tmp/rankn.txt
          grep -q '^GLOBAL_OPERATOR_SCALAR_FALLBACK=0$' /tmp/sce.txt
          grep -q '^GLOBAL_OPERATOR_CENTRAL_SPAWN_LOOP=0$' /tmp/sce.txt
          grep -q '^GLOBAL_OPERATOR_CENTRAL_WAIT_LOOP=0$' /tmp/sce.txt
          grep -q '^GLOBAL_OPERATOR_CENTRAL_REDUCTION_LOOP=0$' /tmp/sce.txt
          echo 'TAIL_GATE_OLD_TECHNICAL_PEAKS=PASS'
      - uses: actions/upload-artifact@v4
        if: steps.isa.outputs.qualified == 'true'
        with:
          name: tail-gate-fusion-${{ matrix.image }}-${{ matrix.slot }}
          path: |
            /tmp/result.txt
            /tmp/audit.txt
            /tmp/probe.txt
            /tmp/gcc.txt
            /tmp/rankn.txt
            /tmp/sce.txt
          if-no-files-found: error
