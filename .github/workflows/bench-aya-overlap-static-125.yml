name: Aya vs Wheelchair 1.2.5 shared static-shape benchmark

on:
  push:
    branches: [bench-aya-overlap-static-1.2.5]
    paths:
      - 'benchmarks/aya_overlap_static_125/**'
      - '.github/workflows/bench-aya-overlap-static-125.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench-aya-overlap-static-1.2.5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Wheelchair 1.2.5
        run: |
          set -euo pipefail
          cd worktree
          sh build.sh

      - name: Build pinned Aya
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/aya-prover/aya-dev.git /tmp/aya-dev
          cd /tmp/aya-dev
          git checkout 5296b348775881e3c797bbc8d1c898a1ac959e00
          ./gradlew :cli-console:installDist --no-daemon -x test
          ./cli-console/build/install/cli-console/bin/cli-console --version

      - name: Benchmark shared static-shape validation
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee overlap_result.txt
          import os, re, statistics, subprocess, sys, time
          from pathlib import Path

          repo = Path.cwd()
          whroot = repo / 'worktree'
          whsrc = repo / 'benchmarks/aya_overlap_static_125/field_shape.wh'
          ayasrc = repo / 'benchmarks/aya_overlap_static_125/field_shape.aya'
          ayaroot = Path('/tmp/aya-dev')
          aya = ayaroot / 'cli-console/build/install/cli-console/bin/cli-console'
          module_path = ayaroot / 'cli-impl/src/test/resources/shared/src'

          def run(cmd, cwd):
              t0 = time.perf_counter_ns()
              cp = subprocess.run(['taskset','-c','0',*map(str,cmd)], cwd=cwd,
                                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              dt = (time.perf_counter_ns() - t0) / 1e6
              if cp.returncode != 0:
                  print('COMMAND_FAILED:', ' '.join(map(str,cmd)))
                  print(cp.stdout)
                  print(cp.stderr)
                  raise SystemExit(cp.returncode)
              return dt

          whcmd = [sys.executable, 'surface/wh_surface.py', 'validate', whsrc]
          ayacmd = [aya, '--module-path', module_path, ayasrc, '--no-color']

          # Correctness / acceptance smoke test.
          wh_cold = run(whcmd, whroot)
          aya_cold = run(ayacmd, ayaroot)

          for _ in range(5): run(whcmd, whroot)
          for _ in range(5): run(ayacmd, ayaroot)
          wh = [run(whcmd, whroot) for _ in range(21)]
          av = [run(ayacmd, ayaroot) for _ in range(21)]

          def metrics(p):
              s = p.read_text(encoding='utf-8')
              return len([ln for ln in s.splitlines() if ln.strip()]), len(s.encode('utf-8')), len(re.sub(r'\s+', '', s))

          wm = metrics(whsrc); am = metrics(ayasrc)
          wmed = statistics.median(wh); amed = statistics.median(av)
          print('HOST_CPU=' + next((ln.split(':',1)[1].strip() for ln in Path('/proc/cpuinfo').read_text().splitlines() if ln.startswith('model name')), 'unknown'))
          print('AYA_COMMIT=5296b348775881e3c797bbc8d1c898a1ac959e00')
          print('WHEELCHAIR_VERSION=1.2.5')
          print('TASK=rank2_shape_preserving_field_transform')
          print(f'WH_COLD_VALIDATE_MS={wh_cold:.6f}')
          print(f'AYA_COLD_TYPECHECK_MS={aya_cold:.6f}')
          print(f'WH_WARM_MEDIAN_VALIDATE_MS={wmed:.6f}')
          print(f'AYA_WARM_MEDIAN_TYPECHECK_MS={amed:.6f}')
          print(f'AYA_OVER_WH_VALIDATION_RATIO={amed/wmed:.6f}')
          print('WH_SAMPLES_MS=' + ','.join(f'{x:.6f}' for x in wh))
          print('AYA_SAMPLES_MS=' + ','.join(f'{x:.6f}' for x in av))
          print(f'WH_NONBLANK_LOC={wm[0]} WH_BYTES={wm[1]} WH_NONWS={wm[2]}')
          print(f'AYA_NONBLANK_LOC={am[0]} AYA_BYTES={am[1]} AYA_NONWS={am[2]}')
          print('BOTH_NATIVE_STATIC_SHAPE_ACCEPT=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aya-wheelchair-overlap-static-125
          path: |
            overlap_result.txt
            benchmarks/aya_overlap_static_125/field_shape.wh
            benchmarks/aya_overlap_static_125/field_shape.aya
          retention-days: 30
