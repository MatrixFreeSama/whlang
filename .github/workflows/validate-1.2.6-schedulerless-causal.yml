name: Validate Wheelchair 1.2.6 General Parallel

on:
  push:
    branches:
      - build-1.2.6-schedulerless-causal
  workflow_dispatch:

jobs:
  general-parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Wheelchair 1.2.6
        working-directory: worktree
        run: |
          set -euxo pipefail
          ./build.sh 2>&1 | tee build_126.log
          test "$(cat VERSION)" = "1.2.6"
          grep -Fq 'SCHEDULERLESS_CAUSAL_RUNTIME_1_2_6=BUILT' build_126.log
          grep -Fq 'GENERAL_PARALLEL_FABRIC_1_2_6=BUILT' build_126.log
          grep -Fq 'GENERAL_PARALLEL_FABRIC_AUTHORITY=topology-parallel' build_126.log
          cmp build/topology-parallel build/topology-fabric-schedulerless
          grep -Fq 'WHEELCHAIR_BUILD=PASS' build_126.log

      - name: Validate universal general parallel semantics
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_general_parallel_126.sh 2>&1 | tee general_parallel_126.log
          grep -Fq 'GENERAL_PARALLEL_BINDING_DAG=PASS' general_parallel_126.log
          grep -Fq 'GENERAL_PARALLEL_SOURCE_ORDER_EDGES=0' general_parallel_126.log
          grep -Fq 'GENERAL_PARALLEL_RECURRENCE_ENCLAVE=PASS' general_parallel_126.log
          grep -Fq 'GENERAL_PARALLEL_RUNTIME_SELECTOR=0' general_parallel_126.log
          grep -Fq 'GENERAL_PARALLEL_GLOBAL_QUEUE=0' general_parallel_126.log
          grep -Fq 'WHEELCHAIR_GENERAL_PARALLEL_1_2_6=PASS' general_parallel_126.log

      - name: Validate schedulerless native execution
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_schedulerless_causal_126.sh 2>&1 | tee schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_RANDOM_DAG_300=PASS' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_MULTISOURCE=PASS' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_MPSC_INBOX=PASS' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_HANDOFF_COLLISIONS=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_LOCAL_FALLBACKS=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_GLOBAL_READY_SCAN=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_GLOBAL_QUEUE_OPS=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_ROOT_SCHEDULER_OPS=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_RUNTIME_COST_SELECTOR=0' schedulerless_126.log
          grep -Fq 'SCHEDULERLESS_CAUSAL_SERIAL_FALLBACK=0' schedulerless_126.log

      - name: WH and WHEX semantic-plan integration
        working-directory: worktree
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'surface')
          import whex_surface, wh_structural, general_parallel_plan as gpp

          def gate(g):
              assert g['source_order_edges']==0
              assert g['synthetic_order_edges']==0
              assert g['global_ready_queue']==0
              assert g['global_ready_scan']==0
              assert g['root_scheduler']==0
              assert g['runtime_cost_selector'] is False
              assert g['serial_fallback']==0
              assert g['schedulerless_causal']['requested_slots']==4

          wd,wp,_=whex_surface.load_surface(Path('surface/whex_examples/heat_en.whex'))
          wg=gpp.plan(wd,4,semantic=whex_surface.semantic_plan(wp),physical_lane='specialized_whex_topology_native')
          gate(wg)
          print('WHEX_GENERAL_PARALLEL_INTEGRATION=PASS')

          hd,hp,_=wh_structural.load_surface(Path('tests/wh_equivalence/semantic_abstraction_showcase.wh'))
          hg=gpp.plan(hd,4,semantic=wh_structural.semantic_plan(hp),physical_lane='specialized_topology_native')
          gate(hg)
          print('WH_GENERAL_PARALLEL_INTEGRATION=PASS')
          PY
          python3 -m py_compile wheelchairc.py whexc.py surface/general_parallel_plan.py surface/schedulerless_causal_plan.py
          grep -Fq "plan['general_parallel_fabric']=parallel" whexc.py
          grep -Fq "'general_parallel_fabric':parallel" wheelchairc.py

      - name: Byte-protect mature 1.2.5 technical peaks
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin build-1.2.5-multifield:refs/remotes/origin/build-1.2.5-multifield
          files=(
            worktree/compiler/topologyc_x86_64.S
            worktree/compiler/general_frontend_x86_64.S
            worktree/compiler/tensor_frontend_x86_64.S
            worktree/compiler/runtime_blob_x86_64.S
            worktree/compiler/general_runtime_blob_x86_64.S
            worktree/runtime/tensor_runtime_template_x86_64.S
            worktree/runtime/general_runtime_template_x86_64.S
            worktree/runtime/causal_return_fabric_x86_64.S
            worktree/runtime/causal_return_parallel_x86_64.S
            worktree/tools/generate_rankn_backend_122.py
            worktree/tools/generate_product_subtract_frontend.py
            worktree/tools/generate_vector_reduction_residency.py
            worktree/tools/generate_shared_dependency_episode_125.py
            worktree/surface/rank_n_product.py
            worktree/surface/shared_dependency_episode.py
            worktree/surface/sparse_causal_expansion.py
          )
          git diff --exit-code origin/build-1.2.5-multifield -- "${files[@]}"
          sha256sum "${files[@]}" | tee worktree/mature_125_byte_witness.sha256
          echo 'MATURE_1_2_5_TECHNICAL_PEAK_BYTES=PASS' | tee worktree/mature_125_byte_gate.log

      - name: Preserve mature derived regression gates
        working-directory: worktree
        run: |
          set -euxo pipefail
          sh ./test_generic_native_125.sh 2>&1 | tee regression_generic_native_125.log
          sh ./test_rank_n_122.sh 2>&1 | tee regression_rankn_122.log
          sh ./test_true_parallel_123.sh 2>&1 | tee regression_true_parallel_123.log
          sh ./test_sparse_causal_expansion_123.sh 2>&1 | tee regression_sce_123.log
          grep -Fq 'WHEELCHAIR_1_2_4_GENERIC_NATIVE_PEAKS_ON_1_2_5=PASS' regression_generic_native_125.log
          grep -Fq 'WHEELCHAIR_RANK_N_1_2_2=PASS' regression_rankn_122.log
          grep -Fq 'WHEELCHAIR_SPARSE_CAUSAL_EXPANSION_1_2_3=PASS' regression_sce_123.log

      - name: Static anti-serial-spine audit
        run: |
          set -euxo pipefail
          ! grep -R -n -E 'root_epoch|root_remaining|pending_count|work_steal|global_ready_queue' \
            worktree/runtime/schedulerless_causal_x86_64.S worktree/runtime/schedulerless_126 worktree/surface/general_parallel_plan.py
          ! nm -an worktree/build/topology-parallel | grep -E 'root_epoch|root_remaining|pending_count|first_child|next_sibling|work_steal|global_ready_queue|mailbox'
          readelf -d worktree/build/topology-parallel 2>&1 | grep -Fq 'There is no dynamic section'

      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-parallel-126-evidence
          if-no-files-found: warn
          retention-days: 90
          path: |
            worktree/build_126.log
            worktree/general_parallel_126.log
            worktree/schedulerless_126.log
            worktree/regression_*.log
            worktree/mature_125_byte_*
            worktree/RELEASE_GATES_1_2_6.txt
            worktree/GENERAL_PARALLEL_FABRIC_1_2_6.md
            worktree/SCHEDULERLESS_SPARSE_CAUSAL_CHARTER_1_2_6.md
