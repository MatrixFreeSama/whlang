name: Export build 1.2.5 source

on:
  push:
    branches: [build-1.2.5-multifield]
    paths:
      - '.github/workflows/export-build-125-source.yml'

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-1.2.5-multifield
      - uses: actions/upload-artifact@v4
        with:
          name: whlang-build-125-source
          path: |
            worktree
            benchmarks
            README.md
          if-no-files-found: error
          retention-days: 1
