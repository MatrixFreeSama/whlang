name: paper-field-address-ablation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-field-address-ablation.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run address-path ablation
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/paper_1_3_127/run_field_address_ablation.py
          cat experiments/paper_1_3_127/field_address_ablation_20261005/RESULTS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/paper_1_3_127/field_address_ablation_20261005
          git rm .github/workflows/paper-field-address-ablation.yml
          git commit -m 'Record Wheelchair 1.3.127 Field address-path ablation'
          git push origin HEAD:main
