name: cleanup-release-1.3.128
on:
  push:
    paths:
      - '.github/workflows/cleanup-release-1.3.128.yml'
permissions:
  contents: write
jobs:
  cleanup-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated build pollution and normalize SHA sidecar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf main/build
          sha=$(sha256sum dist/Wheelchair-1.3.128.zip | awk '{print $1}')
          printf '%s  %s\n' "$sha" 'Wheelchair-1.3.128.zip' > dist/Wheelchair-1.3.128.zip.sha256
          test "$sha" = 'b3e898ffe0d2c24bdbfa56adb5031dba792989ebff04f4fddef334ac0251deba'
          ! unzip -l dist/Wheelchair-1.3.128.zip | grep -q '/build/'
          unzip -p dist/Wheelchair-1.3.128.zip Wheelchair-1.3.128/RELEASE_NOTES_1_3_128.md >/tmp/release-notes.md
          grep -q 'Canonical Packet CoordinateFact Aging' /tmp/release-notes.md
      - name: Commit clean production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wheelchair Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/cleanup-release-1.3.128.yml
          git add -A main/build dist/Wheelchair-1.3.128.zip.sha256 .github/workflows
          git commit -m 'Clean Wheelchair 1.3.128 production tree'
          git push origin HEAD:main
      - name: Publish v1.3.128 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          target=$(git rev-parse HEAD)
          unzip -p dist/Wheelchair-1.3.128.zip Wheelchair-1.3.128/RELEASE_NOTES_1_3_128.md >/tmp/release-notes.md
          if gh release view v1.3.128 >/dev/null 2>&1; then
            gh release delete v1.3.128 -y --cleanup-tag
          fi
          gh release create v1.3.128 \
            dist/Wheelchair-1.3.128.zip \
            dist/Wheelchair-1.3.128.zip.sha256 \
            --target "$target" \
            --title 'Wheelchair 1.3.128 — Canonical Packet CoordinateFact Aging' \
            --notes-file /tmp/release-notes.md
